.fld-dd{flex:none;width:26px;height:100%;display:grid;place-items:center;color:var(--muted);border-left:1px solid var(--line);border-radius:0 999px 999px 0;width:30px}
.fld-dd:hover{color:var(--ink)}
.fld-dd svg.i{width:13px;height:13px;stroke-width:2.2}
.fld.is-off{opacity:.5}
.segc{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:2px;height:34px;padding:3px;border-radius:999px;background:var(--field)}
.segc button{min-width:0;border-radius:999px;display:grid;place-items:center;font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:background-color 160ms ease,color 160ms ease}
.segc button:hover{color:var(--ink)}
.segc button[aria-pressed="true"]{background:var(--seg-on);color:var(--ink);box-shadow:var(--shadow-soft)}
.segc svg.i{width:16px;height:16px}
.swatches{display:flex;flex-wrap:wrap;gap:4px}
.swatch{position:relative;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--field);cursor:pointer;transition:background-color 160ms ease,transform 140ms var(--ease-out)}
.swatch:hover{background:var(--field-hover)}
.swatch:active{transform:scale(.92)}
.swatch i{width:16px;height:16px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--line-strong)}
.swatch[aria-pressed="true"] i{box-shadow:0 0 0 2px var(--panel),0 0 0 3.5px var(--ink)}
.sw-none i{background:linear-gradient(135deg,transparent calc(50% - .75px),var(--line-strong) calc(50% - .75px),var(--line-strong) calc(50% + .75px),transparent calc(50% + .75px))}
.sw-surface i{background:var(--surface-2)}
.sw-color i{background:conic-gradient(from 0deg,#ff5f57,#ffbd2e,#28c840,#1ec8e5,#002FA7,#bf5af2,#ff5f57)}
.sw-color.is-set i{background:var(--c)}
.swatch input[type="color"]{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
/* Palette swatches (tree.palette), "Automático" (half ink, half paper: the text contrasts by itself) and the palette editor */
.sw-pal i{background:var(--c)}
.sw-pal[aria-pressed="true"] i{box-shadow:inset 0 0 0 1px var(--line),0 0 0 2px var(--panel),0 0 0 3.5px var(--ink)}
.sw-auto i{background:linear-gradient(135deg,var(--ink) 0 50%,var(--bg) 50% 100%)}
.sw-add{color:var(--muted)}
.sw-add:hover,.sw-add[aria-expanded="true"]{color:var(--ink)}
.sw-add[aria-expanded="true"]{box-shadow:inset 0 0 0 1.5px var(--focus)}
.sw-add svg.i{width:16px;height:16px;stroke-width:2}
.insp-line.wrap{align-items:start}
.insp-line.wrap .lbl{padding-top:9px}
.insp-sec h4 .h4-act{margin:-4px -6px -4px 0;padding:4px 6px;border-radius:999px;font-size:11.5px;font-weight:600;letter-spacing:0;text-transform:none;color:var(--muted);transition:color 160ms ease,background-color 160ms ease,opacity 160ms ease}
.insp-sec h4 .h4-act:hover{color:var(--ink);background:var(--field)}
.insp-sec h4 .h4-act:disabled{opacity:.4;pointer-events:none}
.btn.toggle{justify-content:flex-start;color:var(--muted)}
.btn.toggle:hover{color:var(--ink)}
.btn.toggle[aria-pressed="true"]{background:color-mix(in srgb,var(--focus) 12%,var(--field));color:var(--focus)}
.pal{display:flex;flex-direction:column;gap:2px;width:252px;max-width:100%;padding:2px}
.pal-h{margin:4px 8px 6px;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.pal-row{display:flex;align-items:center;gap:6px;min-height:38px;padding:3px 2px 3px 5px;border-radius:999px;transition:background-color 120ms ease}
.pal-row:hover{background:color-mix(in srgb,var(--ink) 4%,transparent)}
.pal-dot{position:relative;flex:none;width:26px;height:26px;border-radius:50%;background:var(--c);box-shadow:inset 0 0 0 1px var(--line-strong);cursor:pointer;transition:transform 140ms var(--ease-out)}
.pal-dot:active{transform:scale(.92)}
.pal-dot input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.pal-name{flex:1;min-width:0;height:30px;padding:0 10px;border:0;border-radius:999px;background:transparent;font-size:13px;font-weight:500;outline:none;text-overflow:ellipsis}
.pal-name:hover{background:var(--field)}
.pal-name:focus{background:var(--field);box-shadow:inset 0 0 0 1.5px var(--focus)}
.pal-hex{flex:none;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.pal-row .icon-btn{width:28px;height:28px}
.pal-row .icon-btn svg.i{width:14px;height:14px}
.pal-new{margin-top:6px;padding-top:9px;border-top:1px solid var(--line);border-radius:0}
.pal-new:hover{background:transparent}
.pal-new .pal-name{background:var(--field)}
.pal-q{display:flex;flex-direction:column;gap:6px;padding:8px;border-radius:12px;background:color-mix(in srgb,var(--danger) 7%,transparent)}
.pal-q p{margin:0;font-size:12.5px;line-height:1.4}
.pal-empty{margin:0 8px 4px;font-size:12.5px;color:var(--muted)}
.matrix{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;width:96px;padding:5px;border-radius:14px;background:var(--field)}
.matrix button{height:24px;border-radius:999px;display:grid;place-items:center}
.matrix button i{width:5px;height:5px;border-radius:50%;background:var(--muted);transition:transform 200ms var(--ease-out),background-color 160ms ease}
.matrix button:hover i{background:var(--ink)}
.matrix button[aria-pressed="true"]{background:var(--seg-on);box-shadow:var(--shadow-soft)}
.matrix button[aria-pressed="true"] i{width:14px;height:4px;border-radius:2px;background:var(--ink)}
.rng{display:flex;align-items:center;gap:10px}
.rng input{flex:1;accent-color:var(--ink)}
.rng output{min-width:36px;text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.sel{position:relative;display:flex;align-items:center}
.sel select{appearance:none;-webkit-appearance:none;width:100%;height:34px;padding:0 30px 0 14px;border:0;border-radius:999px;background:var(--field);font-size:12.5px;font-weight:600;color:var(--ink);cursor:pointer}
.sel select:hover{background:var(--field-hover)}
.sel select:disabled{opacity:.5;cursor:not-allowed}
.sel svg.i{position:absolute;right:12px;width:13px;height:13px;stroke-width:2.2;pointer-events:none;opacity:.6}
.file-row{display:flex;align-items:center;gap:10px;padding:5px 14px 5px 5px;border-radius:999px;background:var(--field)}
.file-thumb{width:40px;height:40px;flex:none;border-radius:50%;overflow:clip;display:grid;place-items:center;background:var(--surface-2);color:var(--muted)}
.file-thumb img{width:100%;height:100%;object-fit:cover}
.file-meta{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.hex{display:flex;gap:6px}
/* Image framing, SVG placement, switches, click actions and source files */
.pos-row{display:flex;gap:8px;align-items:stretch}
.pos-xy{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:space-between;gap:6px}
.insp-switch{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:38px;padding:0 6px 0 14px;border-radius:999px;background:var(--field);font-size:12.5px;font-weight:600;text-align:left;transition:background-color 160ms ease}
.insp-switch:hover{background:var(--field-hover)}
.tog{position:relative;width:38px;height:24px;flex:none;border-radius:999px;background:var(--line-strong);transition:background-color 200ms ease}
.tog::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#FFFFFF;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform 260ms var(--ease-out)}
.insp-switch[aria-checked="true"] .tog{background:var(--focus)}
.insp-switch[aria-checked="true"] .tog::after{transform:translateX(14px)}
.alist .alist-i{flex:none;width:26px;height:26px;margin-left:-4px;border-radius:9px;display:grid;place-items:center}
.alist .alist-i svg.i{width:15px;height:15px}
.alist button[aria-pressed="true"] .alist-i{background:color-mix(in srgb,var(--focus) 12%,transparent);color:var(--focus)}
.fld.txt input{padding:0 14px}
.txa{display:block;width:100%;min-height:96px;padding:10px 14px;border:0;border-radius:16px;background:var(--field);font:inherit;font-size:12.5px;line-height:1.5;color:var(--ink);resize:vertical;outline:none;transition:background-color 160ms ease,box-shadow 160ms ease}
.txa:hover{background:var(--field-hover)}
.txa:focus{background:var(--field);box-shadow:inset 0 0 0 1.5px var(--focus)}
.txa::placeholder{color:var(--muted)}
.files{display:flex;flex-direction:column;gap:4px;border-radius:16px;transition:box-shadow 160ms ease}
.frow{display:flex;align-items:center;gap:6px;min-height:40px;padding:4px 4px 4px 5px;border-radius:14px;background:var(--field)}
.fbadge{flex:none;min-width:38px;height:28px;padding:0 6px;border-radius:9px;display:grid;place-items:center;background:var(--panel);color:var(--muted);box-shadow:inset 0 0 0 1px var(--line);font-size:9.5px;font-weight:800;letter-spacing:.05em}
.fbadge[data-k="vec"]{color:var(--focus)}
.fbadge[data-k="doc"]{color:var(--danger)}
.fbadge[data-k="img"]{color:var(--ok)}
.fname{flex:1;min-width:0;height:30px;padding:0 6px;border:0;border-radius:8px;background:transparent;font-size:12.5px;font-weight:600;color:var(--ink);outline:none;text-overflow:ellipsis}
.fname:hover{background:var(--field-hover)}
.fname:focus{background:var(--panel);box-shadow:inset 0 0 0 1.5px var(--focus)}
.fsize{flex:none;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.frow .icon-btn{width:28px;height:28px}
.frow .icon-btn svg.i{width:14px;height:14px}
.frow.is-pending{gap:10px;padding-left:12px;color:var(--muted);font-size:12px}
.frow.is-pending .spinner{width:16px;height:16px}
.mthumbs{display:flex;flex-wrap:wrap;gap:6px}
.mthumbs .thumb{width:62px;height:62px;cursor:default;touch-action:auto}
.mthumbs .thumb-add{display:grid}
.insp-sec h4.sub-h{margin-top:6px}
.insp-foot{display:flex;flex-direction:column;gap:8px;padding:12px 14px 14px;border-top:1px solid var(--line)}
.foot-row{display:flex;gap:8px}
.foot-hint{margin:0;font-size:11.5px;color:var(--muted)}
.foot-hint kbd{font-family:inherit;font-weight:600}

/* ---------- Overlays (menu, search) ---------- */
/* Closed overlays are display:none, not visibility:hidden. Chrome can keep a stale inherited visibility:hidden on
   descendants that have animations running when the overlay opens, which left the menu without its background and
   controls while the category names (re-rendered on open) showed over the page. */
.ov{position:fixed;inset:0;z-index:80;--ov-solid:var(--brand);display:none}
.ov.is-open{display:block}
.ov-bg{position:absolute;inset:0;background:var(--brand)}
/* The circular reveal is a plain circle that grows from the menu button (transform only). It is hidden unless an
   animation shows it, so a stalled frame can never leave the menu without its background. */
.ov-reveal{position:absolute;left:0;top:0;width:0;height:0;border-radius:50%;background:var(--ov-solid);opacity:0;pointer-events:none}
.ov-bg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ov-bg .fs-dim{z-index:1}
.ov-inner{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;overflow-y:auto;padding:20px;padding-top:calc(20px + env(safe-area-inset-top,0px));padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
.ov-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;min-height:48px}
.ov-tl,.ov-tr{display:flex;align-items:flex-start;gap:16px;min-width:0}
.ov-tr{align-items:center;justify-content:flex-end;flex-wrap:wrap;gap:10px}
.ov-tl > :empty,.ov-tr > :empty{display:none}
.ov-close{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;transition:transform 140ms var(--ease-out),background-color 240ms ease,color 240ms ease}
.ov-close:active{transform:scale(.94)}
.ov-close[data-ink="light"]{background:#FFFFFF;color:#000000}
.ov-close[data-ink="dark"]{background:#000000;color:#FFFFFF}
.ov-close svg.i{width:20px;height:20px;stroke-width:1.9}
.ov-list{flex:1;display:flex;flex-direction:column;align-items:flex-start;padding-top:clamp(24px,6vh,64px)}
.ov-list > :first-child{margin-top:auto}
.ov-list > :last-child{max-width:calc(100% - var(--ob-w,0px) - 24px)}
.ov-item{display:flex;align-items:center;gap:10px;max-width:100%}
.ov-cat{font-family:var(--display);font-weight:900;text-transform:uppercase;text-align:left;font-size:clamp(40px,min(8.4vw,calc((100dvh - 300px) / var(--n,4) / .98)),176px);line-height:.98;letter-spacing:-.02em;overflow-wrap:anywhere;transition:opacity 240ms ease}
@media (hover:hover) and (pointer:fine){.ov-list:hover .ov-cat:not(:hover){opacity:.38}}
.ov-item .more{width:40px;height:40px;border-radius:12px}
.ov-item .more svg.i{width:22px;height:22px}
.ov-input{font-family:var(--display);font-weight:900;text-transform:uppercase;font-size:clamp(40px,min(8.4vw,calc((100dvh - 300px) / var(--n,4) / .98)),176px);line-height:.98;letter-spacing:-.02em;padding:0;border-radius:0;width:min(100%,1100px)}
.ov-add{display:inline-flex;align-items:center;gap:10px;margin-top:18px;font-size:16px;font-weight:600;opacity:.6;transition:opacity 160ms ease}
.ov-add:hover{opacity:1}
.ov-bottom{position:absolute;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:10px}
.ov-bottom:empty{display:none}
/* Icon-only switches: theme (top right, subtle ring) and view mode (bottom right, solid like the account chip) */
.seg{--s:40px;position:relative;display:inline-grid;grid-auto-flow:column;grid-auto-columns:var(--s);padding:4px;border-radius:999px;flex:none;transition:background-color 240ms ease,color 240ms ease}
.seg-ind{position:absolute;top:4px;left:4px;width:var(--s);height:var(--s);border-radius:50%;transition:transform 340ms var(--ease-out),background-color 240ms ease}
.seg[data-v="1"] .seg-ind{transform:translateX(var(--s))}
.seg button{position:relative;z-index:1;width:var(--s);height:var(--s);border-radius:50%;display:grid;place-items:center;transition:color 240ms ease,opacity 200ms ease,transform 140ms var(--ease-out)}
.seg button:active{transform:scale(.92)}
.seg svg.i{width:18px;height:18px}
.seg-ghost{box-shadow:inset 0 0 0 1px color-mix(in srgb,currentColor 24%,transparent)}
.seg-ghost .seg-ind{background:color-mix(in srgb,currentColor 18%,transparent)}
.seg-ghost button{opacity:.55}
.seg-ghost button[aria-pressed="true"],.seg-ghost button:hover{opacity:1}
.seg-solid{--s:42px}
.seg-solid[data-ink="light"]{background:#FFFFFF;color:#000000}
.seg-solid[data-ink="dark"]{background:#000000;color:#FFFFFF}
.seg-solid .seg-ind{background:var(--ov-solid)}
.seg-solid[data-ink="light"] button[aria-pressed="true"]{color:#FFFFFF}
.seg-solid[data-ink="dark"] button[aria-pressed="true"]{color:#000000}
.acct{display:inline-flex;align-items:center;gap:10px;height:50px;padding:0 6px;border-radius:999px;transition:background-color 240ms ease,color 240ms ease}
.acct[data-ink="light"]{background:#FFFFFF;color:#000000}
.acct[data-ink="dark"]{background:#000000;color:#FFFFFF}
.acct-in{padding:0 22px 0 18px;font-size:15px;font-weight:500;letter-spacing:-.01em;transition:background-color 240ms ease,color 240ms ease,transform 140ms var(--ease-out)}
.acct-in:active{transform:scale(.97)}
.acct-in svg.i{width:17px;height:17px}
.acct .av{width:38px;height:38px;flex:none;border-radius:50%;display:grid;place-items:center;overflow:hidden;background:var(--ov-solid);font-size:13px;font-weight:700;letter-spacing:.02em}
.acct[data-ink="light"] .av{color:#FFFFFF}
.acct[data-ink="dark"] .av{color:#000000}
.acct .av img{width:100%;height:100%;object-fit:cover}
.acct-txt{display:flex;flex-direction:column;min-width:0;line-height:1.2}
.acct-txt b{font-size:14px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:22ch}
.acct-txt small{font-size:12px;opacity:.55;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:26ch}
.acct-out{height:38px;padding:0 16px;margin-left:4px;border-radius:999px;font-size:14px;font-weight:500;box-shadow:inset 0 0 0 1px color-mix(in srgb,currentColor 18%,transparent);transition:box-shadow 160ms ease,transform 140ms var(--ease-out)}
.acct-out:hover{box-shadow:inset 0 0 0 1px color-mix(in srgb,currentColor 50%,transparent)}
.acct-out:active{transform:scale(.96)}
#menu-bgctl,#menu-theme{display:contents}
.ovbg{display:flex;align-items:center;gap:8px;margin-right:6px}
.ovsw{position:relative;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;cursor:pointer;box-shadow:inset 0 0 0 1.5px color-mix(in srgb,currentColor 35%,transparent);transition:transform 140ms var(--ease-out),box-shadow 160ms ease}
.ovsw:active{transform:scale(.92)}
.ovsw[aria-pressed="true"]{box-shadow:0 0 0 2px currentColor}
.ovsw i{width:22px;height:22px;border-radius:50%;box-shadow:inset 0 0 0 1.5px color-mix(in srgb,currentColor 45%,transparent)}
.ovsw svg.i{width:16px;height:16px}
.ovsw input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.ovbg input[type="range"]{width:90px;accent-color:currentColor}

.ov-search .ov-bg{background:var(--bg)}
.ov-search .ov-inner{color:var(--ink)}
.ov-search .ov-close{background:var(--ink);color:var(--bg)}
.srch{width:min(1120px,100%);margin:clamp(20px,7vh,88px) auto 0;display:flex;flex-direction:column;gap:20px}
.srch-field{position:relative;display:flex;align-items:center;gap:16px;padding-bottom:14px;border-bottom:2px solid var(--line)}
.srch-field:focus-within{border-bottom-color:var(--ink)}
.srch-field svg.i{width:clamp(26px,3vw,40px);height:clamp(26px,3vw,40px);stroke-width:2.2;flex:none;opacity:.35}
.srch-input{flex:1;min-width:0;border:0;outline:none;background:transparent;font-family:var(--display);font-weight:900;text-transform:uppercase;font-size:clamp(40px,6.2vw,104px);line-height:1;letter-spacing:-.02em;color:var(--ink);caret-color:var(--focus)}
.srch-input::placeholder{color:var(--ink);opacity:.14}
.srch-input::-webkit-search-cancel-button{display:none}
.srch-results{display:flex;flex-direction:column;gap:2px;padding-bottom:40px}
.sr{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:4px 16px;padding:14px 16px;border-radius:14px;text-align:left;transition:background-color 140ms ease}
.sr:hover,.sr[aria-selected="true"]{background:var(--surface)}
.sr-title{font-size:18px;font-weight:600;letter-spacing:-.015em}
.sr-crumb{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);grid-row:span 2;align-self:center}
.sr-snip{font-size:14px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sr mark{background:transparent;color:var(--ink);font-weight:700;box-shadow:inset 0 -.38em color-mix(in srgb,var(--focus) 26%,transparent)}
.sr-empty{margin:8px 16px;color:var(--muted);font-size:15px}
.sr-hint{margin:4px 16px 8px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.qi{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:28px 24px;padding:8px 16px 40px}
.qi h3{margin:0 0 10px;font-family:var(--display);font-weight:900;text-transform:uppercase;font-size:24px;line-height:.95;letter-spacing:-.01em}
.qi ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.qi button{font-size:15px;font-weight:500;padding:3px 0;opacity:.5;transition:opacity 160ms ease;text-align:left}
.qi button:hover{opacity:1}
.qi p{margin:0;font-size:14px;color:var(--muted)}

/* ---------- Home: the opening view, a spatial slider of the gallery media ---------- */
/* Home is a view of the page: the top bar stays, the section list, the stage and the page chrome step aside. */
.home{display:none;position:fixed;inset:0;z-index:1;overflow:hidden;background:var(--home-bg);touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
html[data-view="home"] .home{display:block}
html[data-view="home"] #rail-nav,html[data-view="home"] #stage,html[data-view="home"] .status,html[data-view="home"] .page-mode,html[data-view="home"] .insp,html[data-view="home"] .types{display:none!important}
html[data-view="home"]{overscroll-behavior:none;background:var(--home-bg)}
/* On Home the top bar spans the screen: the logo stays top left, search and menu go to the top right corner (on a
   phone the bar already spans it). Switching views slides the buttons over (see moveRailActions). */
@media (min-width:861px){html[data-view="home"] .rail{width:100%}}
/* The stage is the camera: its perspective is centered on the band of images (--hs-cy). Every card hangs from that
   point and the JS loop gives each one its own 3D transform: where it sits on the inside of the curve, turned toward
   the middle, and lifted toward the viewer on hover. Cards take no pointer events (see Slider.pick). */
.hs{position:absolute;inset:0;outline:none}
.hs-stage{position:absolute;inset:0;perspective:var(--hs-p,2400px);perspective-origin:50% var(--hs-cy,50%);pointer-events:none}
/* A card is the image or video itself (size and place set by Slider.layout); its title and description show in the lightbox */
.hs-card{position:absolute;left:0;top:0;transform-origin:50% 50%;backface-visibility:hidden;-webkit-backface-visibility:hidden;will-change:transform}
.hs-card.is-off{visibility:hidden}
.hs-card.is-out > *{visibility:hidden} /* in the lightbox: its place on the curve waits for it to come back */
.hs-media{position:absolute;inset:0;border-radius:var(--hs-r,16px);overflow:hidden;background:var(--ph-0);container-type:size;isolation:isolate;box-shadow:var(--hs-shadow);transition:box-shadow 420ms ease}
.hs-card.is-hover .hs-media{box-shadow:var(--hs-shadow-up);transition-duration:300ms}
.hs:focus-visible .hs-card.is-mid .hs-media{box-shadow:0 0 0 3px var(--focus),var(--hs-shadow)} /* the keyboard is on the slider: Enter opens this one */
.hs-media img,.hs-media video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;opacity:0;transition:opacity 500ms ease}
.hs-media .is-loaded{opacity:1}
:is(.hs-media,.hlb-frame)[data-ph="0"]{background:var(--ph-0)}
:is(.hs-media,.hlb-frame)[data-ph="1"]{background:var(--ph-1);box-shadow:inset 0 0 0 1px var(--line)}
:is(.hs-media,.hlb-frame)[data-ph="2"]{background:var(--ph-2)}
:is(.hs-media,.hlb-frame)[data-ph="3"]{background:var(--ph-3)}
:is(.hs-media,.hlb-frame)[data-ph="4"]{background:var(--ph-4);color:#FFFFFF}
:is(.hs-media,.hlb-frame)[data-ph="5"]{background:linear-gradient(150deg,var(--ph-5),var(--ph-4) 70%);color:#FFFFFF}
.hs-b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--font);font-style:normal;font-weight:800;font-size:34cqw;line-height:1;letter-spacing:-.04em;padding-bottom:4cqh;pointer-events:none}
.home.is-pointing{cursor:pointer}
html.hs-grabbing,html.hs-grabbing *{cursor:grabbing!important}
/* Prev / next: two round outline buttons with a thin chevron, centered at the bottom */
.hs-nav{position:absolute;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:2;display:flex;align-items:center;gap:18px;touch-action:auto}
.hs-btn{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--hs-btn-line);background:transparent;color:var(--ink);transition:border-color 200ms ease,background-color 200ms ease,transform 140ms var(--ease-out)}
.hs-btn svg.i{width:20px;height:20px;stroke-width:1.5}
.hs-btn:hover{border-color:var(--hs-btn-line-hover);background:color-mix(in srgb,var(--ink) 4%,transparent)}
.hs-btn:active{transform:scale(.94);background:color-mix(in srgb,var(--ink) 8%,transparent)}
.hs-btn:focus-visible{outline:2px solid var(--focus);outline-offset:3px}
/* Admin: the gallery button bottom left, and the gallery panel in the left column (it leaves the slider in view) */
.home-tools{position:absolute;left:20px;bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:3;display:flex;align-items:center;gap:14px;touch-action:auto}
.hbtn{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 16px 0 14px;border-radius:999px;background:var(--material);color:var(--ink);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);box-shadow:inset 0 0 0 .5px var(--material-edge),var(--shadow-float);font-size:13.5px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;transition:transform 140ms var(--ease-out),background-color 200ms ease,color 200ms ease}
.hbtn:active{transform:scale(.97)}
.hbtn[aria-expanded="true"]{background:var(--ink);color:var(--bg)}
.hbtn svg.i{width:17px;height:17px}
.hbtn .spinner{width:16px;height:16px;border-width:2px;border-color:color-mix(in srgb,currentColor 25%,transparent);border-top-color:currentColor}
.hbtn-n{min-width:20px;height:20px;padding:0 6px;margin-right:-4px;border-radius:10px;display:grid;place-items:center;background:color-mix(in srgb,currentColor 12%,transparent);font-size:11px;font-weight:700;font-variant-numeric:tabular-nums}
.home-hint{margin:0;font-size:13px;font-weight:500;color:var(--muted);animation:fadeIn 400ms ease both}
.hgal{position:fixed;z-index:55;left:20px;top:calc(84px + env(safe-area-inset-top,0px));width:clamp(272px,calc(25vw - 40px),360px);max-height:calc(100dvh - 168px - env(safe-area-inset-top,0px));display:flex;flex-direction:column;border-radius:18px;background:var(--panel);color:var(--ink);box-shadow:var(--shadow-panel);font-size:12.5px;overflow-x:hidden;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;animation:inspIn 320ms var(--ease-out) both;transition:box-shadow 200ms ease}
.hgal[hidden]{display:none}
.hgal.is-over{box-shadow:inset 0 0 0 2px var(--focus),var(--shadow-panel)}
.hgal-head{position:sticky;top:0;z-index:2;background:var(--panel);display:flex;align-items:center;gap:10px;padding:12px 10px 10px 12px}
.hgal-title{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.25}
.hgal-title strong{font-size:13.5px;font-weight:650;letter-spacing:-.01em}
.hgal-title small{font-size:11.5px;color:var(--muted)}
.hgal-grid{flex:none;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:4px 14px 14px;align-content:start;scrollbar-width:thin}
.hg-th{position:relative;aspect-ratio:1;border-radius:12px;overflow:clip;background:var(--surface-2);cursor:grab;touch-action:none;outline:none;transition:transform 220ms var(--ease-out),box-shadow 200ms ease;animation:pickIn 300ms var(--ease-out) both}
.hg-th img,.hg-th video{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.hg-th:focus-visible{box-shadow:0 0 0 2px var(--focus)}
.hg-th.is-lifted{z-index:5;cursor:grabbing;transition:box-shadow 200ms ease;box-shadow:var(--shadow-float)}
.hg-th:hover .thumb-x,.hg-th:focus-within .thumb-x{opacity:1;transform:none}
.hg-th.is-pending{display:grid;place-items:center;cursor:progress}
.hg-kind{position:absolute;left:6px;top:6px;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:var(--chip);color:var(--on-chip)}
.hg-kind svg.i{width:11px;height:11px;stroke-width:2.2}
.hg-add{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:transparent;box-shadow:inset 0 0 0 1.5px var(--line-strong);color:var(--muted);cursor:pointer;font-size:11.5px;font-weight:600;transition:color 160ms ease,box-shadow 160ms ease,transform 140ms var(--ease-out)}
.hg-add:hover{color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.hg-add:active{transform:scale(.97)}
.hg-add:focus-within{box-shadow:inset 0 0 0 2px var(--focus)}
.hg-add.is-big{grid-column:1 / -1;aspect-ratio:auto;height:120px;font-size:12.5px}
.hg-th.is-sel{box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--ink)}
.hg-th.is-sel:focus-visible{box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--focus)}
/* The caption of the selected item: the label strip under its card on the slider (optional) */
.hgal-sel,.hgal-rad{display:flex;flex-direction:column;gap:8px;padding:12px 14px 14px;border-top:1px solid var(--line)}
.hgal-k{margin:0;font-size:11.5px;font-weight:600;color:var(--muted)}
.hgal-sel .fld input{padding:0 14px;font-variant-numeric:normal}
.hgal-f{position:relative;display:flex;flex-direction:column;gap:4px}
.hgal-f label{display:flex;justify-content:space-between;font-size:11.5px;font-weight:600;color:var(--muted)}
.hgal-f output{font-weight:500;font-variant-numeric:tabular-nums}
.hgal-f textarea{min-height:64px;padding:9px 14px;border:0;border-radius:14px;background:var(--field);font:inherit;font-size:12.5px;font-weight:500;line-height:1.4;color:var(--ink);resize:none;outline:none;transition:box-shadow 160ms ease,background-color 160ms ease}
.hgal-f textarea:hover{background:var(--field-hover)}
.hgal-f textarea:focus{box-shadow:inset 0 0 0 1.5px var(--focus);background:var(--field)}
.hgal-f textarea::placeholder{color:var(--muted);font-weight:500}
.hg-ratio{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:2px;padding:2px;border-radius:999px;background:var(--field)}
.hg-ratio button{height:30px;padding:0 4px;text-align:center;white-space:nowrap;border-radius:999px;font-size:11.5px;font-weight:600;color:var(--muted);transition:background-color 160ms ease,color 160ms ease}
.hg-ratio button:hover{color:var(--ink)}
.hg-ratio button[aria-pressed="true"]{background:var(--seg-on);color:var(--ink);box-shadow:var(--shadow-soft)}
.hgal-rad .rng{font-size:12px}
.hgal-foot{margin:0;padding:10px 16px 14px;border-top:1px solid var(--line);font-size:11.5px;line-height:1.45;color:var(--muted)}
/* The card that was clicked grows into a centered view over a light veil */
.hlb{position:fixed;inset:0;z-index:70;outline:none}
.hlb[hidden]{display:none}
.hlb-bg{position:absolute;inset:0;background:color-mix(in srgb,var(--bg) 76%,transparent);-webkit-backdrop-filter:blur(22px) saturate(150%);backdrop-filter:blur(22px) saturate(150%)}
.hlb-frame{position:fixed;overflow:hidden;border-radius:18px;background:var(--ph-0);container-type:size;box-shadow:0 0 0 .5px rgba(0,0,0,.06),0 24px 60px rgba(0,16,64,.16),0 8px 20px rgba(0,0,0,.06)}
.hlb-frame > img,.hlb-frame > video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.hlb-ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6cqh;padding:8cqh;text-align:center}
.hlb-ph .hs-b{position:static;font-size:30cqh;padding:0}
.hlb-ph p{margin:0;max-width:30ch;font-size:clamp(13px,4.6cqh,17px);font-weight:500;line-height:1.4;opacity:.62}
.hlb-cap{position:fixed;margin:0;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;font-family:var(--font);font-size:14px;line-height:1.45;color:var(--ink);overflow-wrap:anywhere}
.hlb-cap p{margin:0;max-width:60ch}
.hlb-t{font-weight:600;letter-spacing:-.005em}
.hlb-d{font-weight:400;color:color-mix(in srgb,var(--ink) 62%,transparent)}
.hlb-x{position:absolute;top:calc(20px + env(safe-area-inset-top,0px));right:20px;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:var(--bg);box-shadow:var(--shadow-float);transition:transform 140ms var(--ease-out)}
.hlb-x:active{transform:scale(.94)}
.hlb-x svg.i{width:20px;height:20px;stroke-width:1.9}
/* Editors switch viewer / admin from any section page: bottom left, colored by what is under it */
.page-mode{position:fixed;left:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:40;--ov-solid:var(--brand);animation:fadeIn 240ms var(--ease-out) both}
.page-mode[hidden]{display:none}
/* Out of the way while a block is carried: the drop targets are the page and the rail (its fade-in animation holds
   the opacity, so it is hidden with visibility) */
html.is-row-drag .page-mode{visibility:hidden}
.page-mode .seg-solid button[aria-pressed="true"]{color:#FFFFFF}

/* ---------- Popover, status, toasts ---------- */
.pop{position:fixed;z-index:120;min-width:200px;max-width:280px;max-height:60vh;overflow-y:auto;padding:6px;border-radius:14px;background:var(--material);color:var(--ink);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);box-shadow:inset 0 0 0 .5px var(--material-edge),var(--shadow-float);transform-origin:var(--origin,top right);animation:popIn 170ms var(--ease-out) both;font-size:13.5px;text-shadow:none}
.pop.is-closing{animation:popOut 120ms ease-out both}
.mi{width:100%;display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:999px;font-size:13.5px;font-weight:500;text-align:left;transition:background-color 120ms ease}
.mi:hover,.mi:focus-visible{background:var(--surface-2);outline:none}
.mi.danger{color:var(--danger)}
.mi svg.i{width:16px;height:16px}
.mi .mi-v{margin-left:auto;color:var(--muted);font-variant-numeric:tabular-nums}
.mi[aria-checked="true"]{font-weight:700}
.mi:disabled{opacity:.4;pointer-events:none}
.mi[aria-current]{font-weight:650}
.mi-h{margin:10px 12px 3px;font-size:11px;font-weight:650;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.mi-h:first-child{margin-top:6px}
.mi-none{margin:0 12px 6px;font-size:12.5px;color:var(--muted)}
.pop-q{margin:4px 8px 10px;font-size:13px;line-height:1.4}
.pop-q strong{font-weight:650}
.pop-actions{display:flex;gap:6px;justify-content:flex-end;padding:0 2px 2px}
.status{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:40;display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 12px;border-radius:999px;background:var(--material);color:var(--muted);-webkit-backdrop-filter:blur(16px) saturate(180%);backdrop-filter:blur(16px) saturate(180%);box-shadow:inset 0 0 0 .5px var(--material-edge),var(--shadow-soft);font-size:12px;font-weight:500;white-space:nowrap}
.status:empty{display:none}
.status i{width:6px;height:6px;border-radius:50%;background:var(--ok)}
.status[data-state="saving"] i{background:var(--warn);animation:pulse 1s ease-in-out infinite}
.status[data-state="error"] i{background:var(--danger)}
.status[data-state="local"] i{background:var(--line-strong)}
.toasts{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:130;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;width:max-content;max-width:calc(100vw - 32px)}
.toast{padding:11px 16px;border-radius:12px;background:var(--chip);color:var(--on-chip);font-size:13px;font-weight:500;box-shadow:var(--shadow-float);animation:toastIn 300ms var(--ease-out) both}
.toast.is-leaving{animation:toastOut 200ms ease-in both}
/* A toast that can take you somewhere: the only part of the toasts that catches the pointer */
.toast.has-act{display:flex;align-items:center;gap:4px;padding-right:6px;pointer-events:auto}
.toast-act{height:28px;margin-left:6px;padding:0 11px;border-radius:999px;background:color-mix(in srgb,var(--on-chip) 12%,transparent);color:inherit;font-size:12.5px;font-weight:650;white-space:nowrap;transition:background-color 140ms ease,transform 140ms var(--ease-out)}
.toast-act:hover{background:color-mix(in srgb,var(--on-chip) 20%,transparent)}
.toast-act:active{transform:scale(.95)}

/* ---------- Motion ---------- */
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeBlurIn{from{opacity:0;filter:blur(4px);transform:scale(.99)}to{opacity:1;filter:none;transform:none}}
@keyframes rowIn{from{opacity:0;transform:translateY(16px) scale(.985);filter:blur(4px)}to{opacity:1;transform:none;filter:none}}
@keyframes pageIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes slotIn{from{opacity:0;transform:scale(.985)}to{opacity:1;transform:none}}
@keyframes blockIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@keyframes navIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
@keyframes pickIn{from{opacity:0;transform:translateY(8px) scale(.97)}to{opacity:1;transform:none}}
@keyframes inspIn{from{opacity:0;transform:translateX(-12px) scale(.98)}to{opacity:1;transform:none}}
@keyframes popIn{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:none}}
@keyframes popOut{to{opacity:0;transform:scale(.97)}}
@keyframes toastIn{from{opacity:0;transform:translateY(12px) scale(.96)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateY(8px) scale(.98)}}
@keyframes flash{0%{opacity:0}12%{opacity:1}70%{opacity:1}100%{opacity:0}}
@keyframes shimmer{0%,100%{opacity:1}50%{opacity:.45}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes spin{to{transform:rotate(360deg)}}
::view-transition-old(root),::view-transition-new(root){animation-duration:280ms;animation-timing-function:ease}

@media (prefers-reduced-motion: reduce){
  @keyframes rowIn{from{opacity:0}to{opacity:1}}
  @keyframes pageIn{from{opacity:0}to{opacity:1}}
  @keyframes fadeBlurIn{from{opacity:0}to{opacity:1}}
  @keyframes slotIn{from{opacity:0}to{opacity:1}}
  @keyframes blockIn{from{opacity:0}to{opacity:1}}
  @keyframes navIn{from{opacity:0}to{opacity:1}}
  @keyframes pickIn{from{opacity:0}to{opacity:1}}
  @keyframes inspIn{from{opacity:0}to{opacity:1}}
  @keyframes popIn{from{opacity:0}to{opacity:1}}
  @keyframes toastIn{from{opacity:0}to{opacity:1}}
  .pill-ind,.thumb,.drop-line,.sub-item .sub,.hg-th,.hs-card,.hs-media img,.hs-media video,.hs-btn{transition-duration:0ms!important}
  .act-chip{transform:none!important}
  .tog::after,.slot-color{transition:none}
  .skel,.status i{animation:none!important}
}

/* ---------- Narrow screens ---------- */
/* Home: below this width the hint would reach the slider controls; it goes above the gallery button */
@media (max-width:1180px){.home-tools{flex-direction:column-reverse;align-items:flex-start;gap:10px}}
@media (max-width:860px){
  :root{--col-l:16px;--col-r:16px}
  .rail{position:absolute;top:0;right:0;width:auto;height:auto;gap:0;padding:0}
  .rail-top{position:fixed;top:0;left:0;right:0;z-index:31;padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top,0px))}
  .rail-top::before{content:"";position:absolute;inset:0 0 -28px;z-index:-1;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);-webkit-mask-image:linear-gradient(to bottom,#000 55%,transparent);mask-image:linear-gradient(to bottom,#000 55%,transparent);opacity:0;transition:opacity 220ms ease;pointer-events:none}
  html.is-scrolled .rail-top::before{opacity:1}
  .rail-nav{overflow:visible;-webkit-mask-image:none;mask-image:none;padding:calc(92px + env(safe-area-inset-top,0px)) 16px 12px}
  .rail-title{font-size:clamp(34px,10vw,48px)}
  .stage{padding-top:calc(var(--nav-h,300px) + 8px)}
  .stage.starts-full{padding-top:0}
  .row[data-layout="half"] .row-grid{grid-template-columns:minmax(0,1fr)}
  .fs-overlay{padding-left:var(--ov-pl,16px);padding-right:var(--ov-pr,16px)}
  .fs-scrim{background:linear-gradient(180deg,rgba(0,0,0,.46) 0%,rgba(0,0,0,.2) 34%,rgba(0,0,0,0) 56%)}
  .fs-overlay[data-w="half"] > .slot{width:100%}
  .fs-media.slot-picker{padding-left:16px}
  .ac-options{grid-template-columns:1fr}
  .ac-art{aspect-ratio:160/52}
  .types{left:16px;top:calc(12px + env(safe-area-inset-top,0px))}
  .insp{left:8px;right:8px;top:auto;bottom:calc(8px + env(safe-area-inset-bottom,0px));width:auto;max-height:56dvh;animation-name:sheetIn}
  /* Encuadrar on a phone: the sheet and the type bar step aside; the bar on the image has the zoom and "Listo" */
  html.frame-on .insp,html.frame-on .types{visibility:hidden;pointer-events:none}
  .ov-cat,.ov-input{font-size:clamp(36px,13vw,72px)}
  .ov-bottom{position:static;margin-top:16px;flex-wrap:wrap}
  .ov-list > :last-child{max-width:100%}
  .status{right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px))}
  .page-mode,.home-tools{left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px))}
  /* Home on a phone: smaller round arrows, and the gallery button loses its label, so both fit the bottom row; the
     hint goes above the button */
  .hs-nav{bottom:calc(16px + env(safe-area-inset-bottom,0px));gap:16px}
  .hs-btn{width:44px;height:44px}
  .hbtn-t{display:none}
  .hbtn{padding:0 12px}
  .home-tools{flex-direction:column-reverse;align-items:flex-start;gap:10px}
  .home-hint{max-width:150px}
  html.pm-on .rail-nav{padding-bottom:12px} /* the nav flows above the page here: no room to keep for the switch */
  /* the status shares the bottom row with the view switch (92px wide, 50px tall): centered on it, kept clear of it,
     in its short form, and cut with an ellipsis if still too long (the full text is in its tooltip) */
  html.pm-on .status{right:16px;bottom:calc(25px + env(safe-area-inset-bottom,0px));max-width:calc(100vw - 134px)}
  html.pm-on .status span{min-width:0;overflow:hidden;text-overflow:ellipsis}
  html.pm-on .status .st-more{display:none}
  .hgal{left:8px;right:8px;top:auto;bottom:calc(8px + env(safe-area-inset-bottom,0px));width:auto;max-height:56dvh;animation-name:sheetIn}
  .hgal-grid{grid-template-columns:repeat(4,minmax(0,1fr))}
  .hlb-x{top:calc(12px + env(safe-area-inset-top,0px));right:16px;width:44px;height:44px}
}
@keyframes sheetIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
</style>

<main class="home" id="home" aria-label="Inicio" data-home-drop>

/* ---------- Source files, modal images (editor) ---------- */
function sourceType(f) {
  const ext = extOf(f.name);
  let t = (f.type || '').toLowerCase().split(';')[0].trim();
  if (t === 'image/jpg' || t === 'image/pjpeg') t = 'image/jpeg';
  if (t === 'application/x-zip-compressed' || t === 'application/x-zip') t = 'application/zip';
  if (ext === 'ai') t = 'application/illustrator'; else if (ext === 'eps') t = 'application/postscript'; /* browsers disagree on these two */
  if (!SRC_TYPES.includes(t) && EXT[ext]) t = EXT[ext];
  return t;
}
function acceptSource(f) {
  const t = sourceType(f);
  if (!SRC_TYPES.includes(t)) { toast(`«${f.name}» no se puede ofrecer para descargar. Usa SVG, PNG, JPG, PDF, ZIP, EPS, AI o video MP4.`); return null; }
  if (f.size > 50 * MB) { toast(`«${f.name}» pesa ${(f.size / MB).toFixed(1)} MB. El máximo es 50 MB.`); return null; }
  return t;
}
/* Uploads into a list of the module (its source files, or the images of its modal) while the block is being edited */

  if (!ok.length) return;

  renderInspector(); updateFoot(); renderStatus();

  else if (got.length) {

/* ---------- Toasts ---------- */
/* `act` adds a button to the toast ({ label, action, data }), handled by the click switch like any other; such a toast
   stays a little longer so there is time to reach it */
function toast(msg, act = null) {

  if (act) {

    b.dataset.action = act.action; Object.entries(act.data || {}).forEach(([k, v]) => { b.dataset[k] = v; });
    t.append(b);

  /* On a phone the inspector is a sheet at the bottom of the screen: the toast rises above it instead of covering its

  host.style.bottom = r && r.height ? Math.round(innerHeight - r.top + 10) + 'px' : '';
  host.append(t);

    case 'search-close': closeOverlay(); break;
    case 'menu-cat': { const same0 = id === S.cat; closeOverlay(); leaveHome(); if (!same0) openCategory(id); else scrollTop(); break; }
    case 'mode': applyMode(a.dataset.mode); ls.set('mode', a.dataset.mode); break;
    case 'scheme': setScheme(a.dataset.scheme); break;

    case 'menu-bg': {

      mutateTree(t => { t.menu.bg = kind === 'theme' ? { kind: 'theme' } : { kind: 'color', color: BRAND }; });

    case 'pop-rename': { const P = S.pop; closePop(true); if (P && P.data) beginInline({ kind: P.data.kind === 'cat' ? 'rename-cat' : 'rename-sub', id: P.data.id }); break; }
    case 'pop-move': { const P = S.pop; closePop(true); if (P && P.data) moveItem(P.data.kind, P.data.id, +a.dataset.dir); break; }

  if (t && t.id === 'type-style-name') {
    if (ev.key === 'Enter') { ev.preventDefault(); commitTypeStyleName(t.value); }
    else if (ev.key === 'Escape') { ev.preventDefault(); ev.stopPropagation(); S.typeStyleUi = null; renderInspector(); }
    return;
  }
  if (t && (t.id === 'pal-new-name' || (t.dataset && t.dataset.palName)) && ev.key === 'Enter') { ev.preventDefault(); if (t.id === 'pal-new-name') palAdd(); else t.blur(); return; }
  if (t && t.id === 'inline-input') {
    if (ev.key === 'Enter') { ev.preventDefault(); commitInline(t.value); }
    else if (ev.key === 'Escape') { ev.preventDefault(); ev.stopPropagation(); cancelInline(); }
    return;
  }
  /* Arrow keys walk the items of an open menu (the "Mover a…" list can be long) */
  if (S.pop && (ev.key === 'ArrowDown' || ev.key === 'ArrowUp') && t && t.closest && t.closest('#pop')) {
    const items = $$('#pop .mi:not(:disabled)'); if (!items.length) return;
    ev.preventDefault();
    const i = items.indexOf(t), down = ev.key === 'ArrowDown';
    items[i < 0 ? (down ? 0 : items.length - 1) : (i + (down ? 1 : items.length - 1)) % items.length].focus();
    return;
  }
  if (S.edit && S.mode === 'admin' && (ev.metaKey || ev.ctrlKey) && !ev.altKey && (ev.key === 'z' || ev.key === 'Z' || ev.key === 'y' || ev.key === 'Y')) {
    ev.preventDefault();
    if (ev.key.toLowerCase() === 'y' || ev.shiftKey) redo(); else undo();
    return;
  }
  if (Gallery.isOpen && !typing && (ev.metaKey || ev.ctrlKey) && !ev.altKey && !ev.shiftKey && (ev.key === 'z' || ev.key === 'Z')) { ev.preventDefault(); homeUndo(); return; }
  if ((ev.metaKey || ev.ctrlKey) && ev.key === 'Enter' && S.edit && S.mode === 'admin') { ev.preventDefault(); if (t && t.blur && t.closest && t.closest('#insp')) t.blur(); confirmEdit(); return; }
  if (t && t.dataset && t.dataset.f && FIELD[t.dataset.f] && (ev.key === 'ArrowUp' || ev.key === 'ArrowDown')) { ev.preventDefault(); stepField(t, ev.key === 'ArrowUp' ? 1 : -1, ev.shiftKey); return; }
  if (t && t.dataset && (t.dataset.f || t.dataset.fileName) && ev.key === 'Enter' && t.tagName !== 'TEXTAREA') { t.blur(); return; }
  if (t && t.dataset && t.dataset.hf && ev.key === 'Enter') { ev.preventDefault(); Gallery.txtCommit(); return; } /* one paragraph: Enter saves */
  if (t && t.matches && !S.edit && t.matches('.slot[data-act]') && (ev.key === 'Enter' || ev.key === ' ')) { ev.preventDefault(); slotAct(t); return; }
  if (t && t.id === 'search-input') {
    if (ev.key === 'ArrowDown' || ev.key === 'ArrowUp') { ev.preventDefault(); if (!lastResults.length) return; S.srSel = clamp(S.srSel + (ev.key === 'ArrowDown' ? 1 : -1), 0, lastResults.length - 1); renderSearch(t.value); const s = $('#sr-' + S.srSel); s && s.scrollIntoView({ block: 'nearest' }); return; }
    if (ev.key === 'Enter') { ev.preventDefault(); const r = lastResults[S.srSel]; if (r) goResult(r.cat, r.sub, r.row); return; }
  }
  if ((ev.metaKey || ev.ctrlKey) && (ev.key === 'k' || ev.key === 'K') && !S.modal) { ev.preventDefault(); if (S.overlay === 'search') closeOverlay(true); else openOverlay('search', { instant: true }); return; }
  if (ev.key === '/' && !typing && !S.overlay && !S.edit && !S.modal) { ev.preventDefault(); openOverlay('search', { instant: true }); return; }
  if (ev.key === 'Escape') {
    if (S.modal) { closeActModal(); return; }
    if (Motion.pv) { Motion.stopPreview(); return; }
    if (S.frameUi && !(S.pop && S.pop.trigger)) { setFrameMode(false); return; }
    if (S.pop) { const tr = S.pop.trigger; closePop(); tr && tr.focus && tr.focus(); return; }
    if (Lightbox.on) { Lightbox.close(); return; }
    if (S.overlay) { closeOverlay(true); return; }
    if (Gallery.isOpen) { Gallery.close(); const b = $('#home-tools [data-action="home-gal"]'); b && b.focus({ preventScroll: true }); return; }
    if (S.adder) { setAdder(null); return; }
    if (S.confirmDelete) { S.confirmDelete = null; refreshRowTools(); return; }
  }
  if (ev.key === 'Tab' && (S.modal || Lightbox.on || S.overlay)) {
    const f = focusables(S.modal ? $('#amodal') : Lightbox.on ? $('#home-lb') : $('#' + S.overlay)); if (!f.length) return;
    const i = f.indexOf(document.activeElement);
    if (ev.shiftKey && (i <= 0)) { ev.preventDefault(); f[f.length - 1].focus(); }
    else if (!ev.shiftKey && i === f.length - 1) { ev.preventDefault(); f[0].focus(); }
  }
  const gth = t && t.closest && t.closest('#home-gal .hg-th[data-index]');
  if (gth && !typing) {
    const i = +gth.dataset.index, id = gth.dataset.id;
    if (ev.key === 'Delete' || ev.key === 'Backspace') { ev.preventDefault(); homeRemove(id); return; }
    const step = { ArrowLeft: -1, ArrowRight: 1, ArrowUp: -(MOBILE.matches ? 4 : 3), ArrowDown: MOBILE.matches ? 4 : 3 }[ev.key];
    if (ev.altKey && step) {
      ev.preventDefault();
      homeMove(id, clamp(i + step, 0, homeMedia().length - 1));
      const nt = $$('#home-gal .hg-th[data-index]').find(n => n.dataset.id === id); nt && nt.focus();
      return;
    }
  }
  /* Home: the arrows move the slider, Enter or Space on it opens the card in the middle */
  if (S.view === 'home' && !typing && !S.overlay && !S.modal && !S.edit && !Lightbox.on && !ev.altKey && !ev.metaKey && !ev.ctrlKey && !(t && t.closest && t.closest('#home-gal'))) {
    if (ev.key === 'ArrowLeft' || ev.key === 'ArrowRight') { ev.preventDefault(); Slider.hold(); Slider.go(ev.key === 'ArrowLeft' ? -1 : 1); return; }
    if ((ev.key === 'Enter' || ev.key === ' ') && t && t.id === 'hs') { ev.preventDefault(); Slider.hold(); if (Slider.mid) Lightbox.open(Slider.mid); return; }
  }
  if (S.frameUi && !typing && /^Arrow(Left|Right|Up|Down)$/.test(ev.key)) {
    const s = frameSlot(); if (!s) return;
    ev.preventDefault(); record('frame-key');
    const f = { ...FRAME_DEF, ...(s.frame || {}) }, d = ev.shiftKey ? 10 : 1;
    if (ev.key === 'ArrowLeft') f.x = clamp(f.x - d, 0, 100); if (ev.key === 'ArrowRight') f.x = clamp(f.x + d, 0, 100);
    if (ev.key === 'ArrowUp') f.y = clamp(f.y - d, 0, 100); if (ev.key === 'ArrowDown') f.y = clamp(f.y + d, 0, 100);
    setFrame(s, f); paintFrameUi(s); Ink.schedule(); return;
  }
  const th = t && t.closest && t.closest('.thumb[data-index]');
  if (th && ev.altKey && (ev.key === 'ArrowLeft' || ev.key === 'ArrowRight')) {
    ev.preventDefault();
    const s = S.edit && findSlot(S.edit.draft, th.parentElement.dataset.slot); if (!s) return;
    const i = +th.dataset.index, j = i + (ev.key === 'ArrowLeft' ? -1 : 1);
    if (j < 0 || j >= s.images.length) return;
    record(null);
    [s.images[i], s.images[j]] = [s.images[j], s.images[i]];
    bump();
    const nt = $(`.thumbs[data-slot="${s.id}"] .thumb[data-index="${j}"]`); nt && nt.focus();
  }
});
document.addEventListener('focusin', (ev) => {
  const th = ev.target && ev.target.closest && ev.target.closest('#home-gal .hg-th[data-index]');
  if (th) Gallery.select(th.dataset.id);
  if (ev.target && ev.target.id === 'home-speed') Slider.preview(true, +ev.target.value);
});
document.addEventListener('focusout', (ev) => {
  if (ev.target && ev.target.id === 'home-speed') Slider.preview(false);
  const t = ev.target;
  if (t && t.id === 'inline-input') setTimeout(() => { if (t.isConnected && S.inline && document.activeElement !== t) commitInline(t.value); }, 0);
});

/* Drag and drop of files */
let overEl = null;
const canImport = () => S.backend === 'supabase' && S.canEdit && S.mode === 'admin' && !S.edit && !S.importing;
let galOverT = 0;
document.addEventListener('dragover', (ev) => {
  if (homeDropZone(ev)) {
    ev.preventDefault(); ev.dataTransfer.dropEffect = 'copy';
    Gallery.open(); /* the gallery opens as the visible place to drop */
    const g = $('#home-gal'); g && g.classList.add('is-over');
    clearTimeout(galOverT); galOverT = setTimeout(() => { const g2 = $('#home-gal'); g2 && g2.classList.remove('is-over'); }, 160);
    return;
  }
  const z = ev.target.closest && (ev.target.closest('[data-drop-files]') || ev.target.closest('[data-drop]'));
  if (!z && canImport() && ev.dataTransfer && [...ev.dataTransfer.types].includes('Files')) { ev.preventDefault(); ev.dataTransfer.dropEffect = 'copy'; return; }
  if (!z || !S.edit || !ev.dataTransfer || ![...ev.dataTransfer.types].includes('Files')) return;
  ev.preventDefault(); ev.dataTransfer.dropEffect = 'copy';
  if (overEl !== z) { overEl && overEl.classList.remove('is-over'); overEl = z; z.classList.add('is-over'); }
});
document.addEventListener('dragleave', (ev) => { if (overEl && !overEl.contains(ev.relatedTarget)) { overEl.classList.remove('is-over'); overEl = null; } });
document.addEventListener('drop', (ev) => {
  const z = ev.target.closest && ev.target.closest('[data-drop]');
  if (overEl) { overEl.classList.remove('is-over'); overEl = null; }
  const zf = ev.target.closest && ev.target.closest('[data-drop-files]');
  if (zf && S.edit && ev.dataTransfer && ev.dataTransfer.files.length) { ev.preventDefault(); uploadInto(zf.dataset.dropFiles, ev.dataTransfer.files, 'files'); return; }
  if (!z && canImport() && ev.dataTransfer && [...ev.dataTransfer.files].some(f => /\.json$/i.test(f.name))) { ev.preventDefault(); importExport(ev.dataTransfer.files); return; }
  if (homeDropZone(ev)) { ev.preventDefault(); const g = $('#home-gal'); g && g.classList.remove('is-over'); uploadHome(ev.dataTransfer.files); return; }
  if (!z || !S.edit) return;
  ev.preventDefault();
  handleFiles(z.dataset.drop, ev.dataTransfer.files);
});

/* ---------- One-time import of the artifact content (Supabase) ----------
   An editor drops the export (belo-export.json plus its image files) anywhere on the page. Every file is uploaded to
   the bucket, the old asset ids are swapped for the new ones, and the documents are saved through the normal save path. */
async function importExport(fileList) {
  const files = [...fileList];
  const jf = files.find(f => /\.json$/i.test(f.name));
  let exp = null;
  try { exp = JSON.parse(await jf.text()); } catch {}
  if (!exp || exp.format !== 'belo-catalog-export' || !exp.docs || !exp.docs['catalog/tree']) { toast('Ese archivo no es una exportación del catálogo.'); return; }
  const byName = new Map(files.filter(f => f !== jf).map(f => [f.name, f]));
  const olds = Object.keys(exp.assets || {});
  const missing = olds.filter(id => !byName.has(exp.assets[id].file));
  if (missing.length) { toast(`Faltan ${missing.length} ${missing.length === 1 ? 'archivo' : 'archivos'} de la exportación. Suelta el .json junto con todas sus imágenes.`); return; }
  const paths = Object.keys(exp.docs).filter(p => /^(catalog\/tree|pages\/[A-Za-z0-9_-]{1,64})$/.test(p));
  const count = (n, one, many) => `${n} ${n === 1 ? one : many}`;
  const what = `${count(paths.length - 1, 'sección', 'secciones')} y ${count(olds.length, 'archivo', 'archivos')}`;
  if (!confirm(`Importar ${what} al catálogo compartido. Reemplaza el árbol de categorías actual. ¿Seguir?`)) return;
  S.importing = true;
  const map = new Map();
  try {
    for (let i = 0; i < olds.length; i++) {
      const a = exp.assets[olds[i]];
      S.uploading.set('import', { label: `Importando ${i + 1} de ${olds.length}` }); renderStatus();
      const r = await B.assets.upload(byName.get(a.file), { type: a.type || byName.get(a.file).type });
      map.set(olds[i], r.id);
    }
  } catch (e) {
    S.uploading.delete('import'); S.importing = false; renderStatus();
    dropAssets([...map.values()]);
    toast(UPLOAD_ERR[e && e.code] || 'No se pudo subir un archivo de la exportación. No se importó nada.');
    return;
  }
  S.uploading.delete('import');
  const swap = (v) => typeof v === 'string' ? (map.get(v) || v) : Array.isArray(v) ? v.map(swap) : v && typeof v === 'object' ? Object.fromEntries(Object.entries(v).map(([k, x]) => [k, swap(x)])) : v;
  paths.forEach(p => { const data = swap(exp.docs[p]); commit(p, () => clone(data)); notify(p); });
  S.importing = false;
  S.tree = normTree(viewOf('catalog/tree'));
  S.cat = null;
  onTree();
  toast(`Listo: se importaron ${what}.`);
}
document.addEventListener('pointerdown', (ev) => { if (S.pop && !ev.target.closest('#pop') && !ev.target.closest(POP_TRIGGERS.map(x => `[data-action="${x}"]`).join(', '))) closePop(); }, true);

/* ================= Smooth scroll ================= */
function initLenis() {
  if (RM || typeof window.Lenis !== 'function') return;
  try { lenis = new window.Lenis({ autoRaf: true, lerp: .1, smoothWheel: true, prevent: (n) => !!(n.closest && n.closest('.rail-nav, .ov, .insp, .pop, .thumbs, .amodal, .is-framing')) }); }
  catch { lenis = null; }
}

boot();
})();
</script>
