/* Layout: a fixed, containerless 25% rail (logo, search, menu, category title, sections) over a page whose modules sit in the 75% column; full-screen modules run under the rail */
:root{
  --bg:#FFFFFF;
  --ink:#000000;
  --muted:rgba(0,0,0,.46);
  --surface:#F2F3F6;
  --surface-2:#E7E9EE;
  --line:rgba(0,0,0,.08);
  --line-strong:rgba(0,0,0,.2);
  --brand:#002FA7;
  --focus:#002FA7;
  --danger:#D4321F;
  --ok:#1F9D63;
  --warn:#E5A000;
  --panel:#FFFFFF;
  --field:#F1F2F5;
  --field-hover:#E7E9EE;
  --seg-on:#FFFFFF;
  --material:rgba(255,255,255,.8);
  --material-edge:rgba(255,255,255,.6);
  --chip:rgba(12,12,14,.92);
  --on-chip:#FFFFFF;
  --shadow-soft:0 1px 2px rgba(0,0,0,.06),0 2px 8px rgba(0,0,0,.05);
  --shadow-float:0 1px 1px rgba(0,0,0,.04),0 6px 18px rgba(0,0,0,.08),0 18px 44px rgba(0,0,0,.08);
  --shadow-panel:0 0 0 .5px rgba(0,0,0,.1),0 10px 30px rgba(0,0,0,.1),0 30px 70px rgba(0,0,0,.08);

  --font:"Plus Jakarta Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --display:"Phudu","Plus Jakarta Sans",ui-sans-serif,system-ui,sans-serif;
  --radius:20px;
  --gap:20px;
  --col-l:25%;
  --col-r:20px;
  --u:min(1px, calc(100vw / 1512));
  --ease-out:cubic-bezier(.23,1,.32,1);
  --ease-in-out:cubic-bezier(.77,0,.175,1);
  --ease-drawer:cubic-bezier(.32,.72,0,1);
}
:root[data-scheme="dark"]{
  --bg:#000000; --ink:#FFFFFF; --muted:rgba(255,255,255,.5); --surface:#111214; --surface-2:#1D1E22;
  --line:rgba(255,255,255,.1); --line-strong:rgba(255,255,255,.24); --focus:#7C95FF; --danger:#FF7A66; --ok:#3DD68C; --warn:#F5C04A;
  --panel:#141518; --field:#1F2025; --field-hover:#292A30; --seg-on:#34353C;
  --material:rgba(22,22,24,.8); --material-edge:rgba(255,255,255,.08); --chip:rgba(245,245,247,.95); --on-chip:#000000;
  --shadow-soft:0 1px 2px rgba(0,0,0,.5),0 2px 8px rgba(0,0,0,.4);
  --shadow-float:0 1px 1px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.55);
  --shadow-panel:0 0 0 .5px rgba(255,255,255,.1),0 16px 50px rgba(0,0,0,.7);
  color-scheme:dark;
}
@media (prefers-color-scheme: dark){
  :root:not([data-scheme]){
    --bg:#000000; --ink:#FFFFFF; --muted:rgba(255,255,255,.5); --surface:#111214; --surface-2:#1D1E22;
    --line:rgba(255,255,255,.1); --line-strong:rgba(255,255,255,.24); --focus:#7C95FF; --danger:#FF7A66; --ok:#3DD68C; --warn:#F5C04A;
    --panel:#141518; --field:#1F2025; --field-hover:#292A30; --seg-on:#34353C;
    --material:rgba(22,22,24,.8); --material-edge:rgba(255,255,255,.08); --chip:rgba(245,245,247,.95); --on-chip:#000000;
    color-scheme:dark;
  }
}
@media (prefers-reduced-transparency: reduce){ :root{--material:var(--panel)} }

html.lenis, html.lenis body{height:auto}
.lenis [data-lenis-prevent]{overscroll-behavior:contain}

*,*::before,*::after{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent;text-align:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:8px}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
html[data-mode="viewer"] .admin-only{display:none!important}
html.mode-in .admin-only{animation:fadeIn 240ms var(--ease-out) both}
html.ov-open.no-lenis{overflow:hidden}

/* ---------- Adaptive ink ---------- */
[data-adapt]{color:var(--ink);transition:color 240ms ease}
[data-adapt][data-ink="light"]{color:#FFFFFF}
[data-adapt][data-ink="dark"]{color:#000000}
[data-adapt][data-photo][data-ink="light"]{text-shadow:0 1px 18px rgba(0,0,0,.28)}

/* ---------- Rail ---------- */
.rail{position:fixed;top:env(safe-area-inset-top,0px);left:0;z-index:30;width:25%;height:calc(100dvh - env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:clamp(36px,9vh,96px);padding:20px;pointer-events:none;transition:opacity 300ms ease}
.rail > *{pointer-events:auto}
.rail-top{position:relative;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px}
.rail-actions{display:flex;gap:8px;flex:none}
.rbtn{position:relative;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;box-shadow:inset 0 0 0 1px color-mix(in srgb,currentColor 18%,transparent);transition:background-color 240ms ease,color 240ms ease,box-shadow 240ms ease,transform 140ms var(--ease-out)}
.rbtn:active{transform:scale(.94)}
@media (hover:hover) and (pointer:fine){.rbtn:hover{box-shadow:inset 0 0 0 1px color-mix(in srgb,currentColor 42%,transparent)}}
.rbtn svg.i{width:19px;height:19px;stroke-width:1.9}
.rbtn-menu[data-ink="light"]{background:#FFFFFF;color:#000000;box-shadow:none}
.rbtn-menu[data-ink="dark"]{background:transparent}

.logo-wrap{position:relative;display:flex;align-items:center;min-width:0}
.logo{display:flex;align-items:center;height:44px;border-radius:10px;transition:transform 140ms var(--ease-out)}
.logo:active{transform:scale(.97)}
.logo img{display:block;max-height:30px;max-width:150px;width:auto;height:auto;object-fit:contain;transition:filter 240ms ease}
[data-ink="light"] .logo[data-mono] img{filter:brightness(0) invert(1)}
[data-ink="dark"] .logo[data-mono] img{filter:brightness(0)}
.logo-empty{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:999px;box-shadow:inset 0 0 0 1.5px color-mix(in srgb,currentColor 30%,transparent);font-size:12.5px;font-weight:600;opacity:.7;transition:opacity 160ms ease,transform 140ms var(--ease-out)}
.logo-empty:hover{opacity:1}
.logo-empty:active{transform:scale(.97)}
.logo-empty svg.i{width:15px;height:15px}
.logo-edit{position:absolute;top:-4px;right:-12px;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--chip);color:var(--on-chip);box-shadow:var(--shadow-soft);opacity:0;transform:scale(.9);transition:opacity 160ms ease,transform 200ms var(--ease-out)}
.logo-edit svg.i{width:13px;height:13px;stroke-width:2}
.logo-wrap:hover .logo-edit,.logo-edit:focus-visible{opacity:1;transform:none}
@media (hover:none){.logo-edit{opacity:1;transform:none}}

.rail-nav{display:flex;flex-direction:column;gap:16px;min-height:0;overflow-y:auto;scrollbar-width:none;padding-bottom:24px;-webkit-mask-image:linear-gradient(to bottom,#000 calc(100% - 28px),transparent);mask-image:linear-gradient(to bottom,#000 calc(100% - 28px),transparent)}
.rail-nav::-webkit-scrollbar{display:none}
.rail-title{margin:0;font-family:var(--display);font-weight:900;font-size:clamp(34px,3.2vw,54px);line-height:.92;letter-spacing:-.02em;text-transform:uppercase;text-wrap:balance;overflow-wrap:anywhere}
.subs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.sub-item{display:flex;align-items:center;gap:4px;min-width:0}
.sub{flex:1;min-width:0;padding:5px 0;font-size:16px;font-weight:500;line-height:1.25;letter-spacing:-.015em;opacity:.42;transition:opacity 200ms ease;overflow-wrap:anywhere}
.sub:hover{opacity:.82}
.sub.is-active{opacity:1}
.sub.is-empty{opacity:.18;cursor:default}
.sub-item[data-photo] .sub:not(.is-active):not(.is-empty){opacity:.72}
.sub-item[data-photo] .sub.is-empty{opacity:.34}
.sub.has-draft::after{content:"";display:inline-block;width:6px;height:6px;margin-left:8px;border-radius:50%;background:var(--warn);vertical-align:middle;transform:translateY(-2px)}
.more{width:28px;height:28px;flex:none;border-radius:8px;display:grid;place-items:center;opacity:0;transition:opacity 160ms ease,background-color 160ms ease}
.more svg.i{width:16px;height:16px}
.sub-item:hover .more,.ov-item:hover .more,.more:focus-visible,.more[aria-expanded="true"]{opacity:.7}
.more:hover{opacity:1!important;background:color-mix(in srgb,currentColor 10%,transparent)}
@media (hover:none){.more{opacity:.45}}
.nav-add{display:inline-flex;align-items:center;gap:8px;margin-top:6px;padding:5px 0;font-size:14px;font-weight:500;opacity:.38;transition:opacity 160ms ease}
.nav-add:hover{opacity:.85}
.nav-add svg.i{width:15px;height:15px;stroke-width:2}
.inline-input{width:100%;padding:5px 0;margin:0;border:0;border-radius:0;background:transparent;outline:none;font-size:16px;font-weight:500;line-height:1.25;letter-spacing:-.015em;color:inherit;caret-color:currentColor}
.inline-input:focus-visible{outline:none}
.inline-input::placeholder{color:inherit;opacity:.4}
.sub-item.is-new,.ov-item.is-new{animation:navIn 360ms var(--ease-out) both}
.rail-empty{font-size:14px;opacity:.5;margin:0}
/* Other editors, in their own color: initials after the section they are in, and an outline with a name tag on the block they have open */
.peers{display:inline-flex;flex:none;margin-left:2px;animation:navIn 360ms var(--ease-out) both}
.peers .peer + .peer{margin-left:-5px}
.peer{width:20px;height:20px;flex:none;border-radius:50%;display:inline-grid;place-items:center;font-size:8.5px;font-weight:700;letter-spacing:.02em;line-height:1;background:var(--pc,var(--brand));color:#FFFFFF;box-shadow:0 0 0 2px var(--bg)}
.sub-item[data-photo] .peer,.sub-item[data-ink="light"] .peer{box-shadow:none}
.row.has-peer .row-grid > .slot{outline:1.5px solid var(--pc,var(--brand));outline-offset:4px}
.row.has-peer .fs-media{outline:2px solid var(--pc,var(--brand));outline-offset:-8px}
.row-peer{position:absolute;top:-5px;left:0;z-index:6;translate:0 -100%;display:flex;align-items:center;height:18px;padding:0 7px;border-radius:5px;background:var(--pc,var(--brand));color:#FFFFFF;font-size:10.5px;font-weight:600;letter-spacing:-.005em;white-space:nowrap;pointer-events:none;animation:navIn 280ms var(--ease-out) both}
.row-peer.is-below{top:calc(100% + 5px);translate:none}
.row[data-layout="fullscreen"] > .row-peer{top:16px;left:calc(var(--col-l) + 16px);translate:none}
.sub-item.has-peers .sub{flex:0 1 auto}
.sub-item.has-peers .more{margin-left:auto}
.skel{display:block;border-radius:8px;background:var(--surface-2);animation:shimmer 1.4s ease-in-out infinite}
.rail-nav .skel{height:16px;margin:8px 0}

/* ---------- Stage ---------- */
.stage{position:relative;display:flex;flex-direction:column;gap:var(--gap);padding-block:20px 96px;min-height:100dvh}
.stage.starts-full{padding-top:0}
.sec{display:flex;flex-direction:column;gap:var(--gap)}
.sec .rows{display:flex;flex-direction:column;gap:var(--gap)}
.sec .rows:empty{display:none}
html[data-mode="viewer"] .sec.is-empty{display:none}
.col,.sec .row:not([data-layout="fullscreen"]){margin-left:var(--col-l);margin-right:var(--col-r)}
.sec-mark{height:0;border-top:1.5px dashed var(--line-strong)}
.sec:first-child .sec-mark{display:none}
.skel-block{border-radius:var(--radius);aspect-ratio:16/7}
.empty-note{border-radius:var(--radius);background:var(--surface);padding:clamp(28px,6vw,72px);display:flex;flex-direction:column;align-items:flex-start;gap:14px}
.empty-note h2{margin:0;font-family:var(--display);font-weight:900;text-transform:uppercase;font-size:clamp(1.8rem,3.4vw,3rem);line-height:.95;letter-spacing:-.02em;text-wrap:balance}
.empty-note p{margin:0;color:var(--muted);max-width:52ch}

html.is-editing .rail,html.is-editing .sec-mark,html.is-editing .adder,html.is-editing .row:not(.is-editing),html.is-editing .status{opacity:.14;pointer-events:none}
.sec-mark,.adder,.row,.status{transition:opacity 300ms ease}

.row{position:relative;container-type:inline-size}
.row-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:var(--gap)}
.row[data-layout="half"] .row-grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.row.is-entering{animation:rowIn 480ms var(--ease-out) both}
.row.is-paging{animation:pageIn 280ms var(--ease-out) both;animation-delay:var(--delay,0ms)}
.row.is-flash::after{content:"";position:absolute;inset:-6px;border-radius:calc(var(--radius) + 6px);box-shadow:0 0 0 2px var(--focus);pointer-events:none;animation:flash 1600ms ease-out both}
.row[data-layout="fullscreen"].is-flash::after{inset:0;border-radius:0}

.slot{position:relative;border-radius:var(--radius);overflow:clip;min-width:0;container-type:inline-size;--k:min(1px, calc(100cqi / var(--ref, 1114)))}
.row.has-h .row-grid > .slot{min-height:calc(var(--h) * var(--u))}
.slot.is-swapped{animation:slotIn 260ms var(--ease-out) both}
/* Animation presets: SplitText line masks get room for ascenders and descenders; the block can't be edited while it previews */
.sl-mask,.sw-mask,.sc-mask{overflow:visible!important;clip-path:inset(-.14em -.08em -.24em -.08em)}
.row.is-splitview{pointer-events:none}
.tb[data-split-by] .sl{position:relative}
.tb[data-split-by="lines"] .sl{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--focus) 60%,transparent);border-radius:4px}
.tb[data-split-by="words"] .sw{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--focus) 60%,transparent);border-radius:4px}
.tb[data-split-by="chars"] .sc{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--focus) 50%,transparent);border-radius:2px}
.tb[data-split-by]{counter-reset:ln}
.tb[data-split-by="lines"] .sl{counter-increment:ln}
.tb[data-split-by="lines"] .sl::before{content:counter(ln);position:absolute;right:calc(100% + 8px);top:50%;transform:translateY(-50%);min-width:18px;height:18px;padding:0 4px;border-radius:9px;display:grid;place-items:center;background:var(--focus);color:#fff;font:700 10px/1 var(--font);letter-spacing:0;text-transform:none}
.ease-ctl{display:flex;flex-direction:column;gap:6px;min-width:0}
.ease-row{display:flex;gap:6px;align-items:center}
.ease-row .sel{flex:1;min-width:0}
.ease-thumb{width:44px;height:34px;flex:none;border-radius:10px;display:grid;place-items:center;background:var(--field);transition:background-color 160ms ease,box-shadow 160ms ease}
.ease-thumb:hover{background:var(--field-hover)}
.ease-thumb[aria-expanded="true"]{box-shadow:inset 0 0 0 1.5px var(--focus)}
.ease-thumb svg{width:44px;height:32px;overflow:visible}
.ez-base{stroke:var(--line-strong);stroke-width:1;fill:none}
.ez-line{stroke:var(--ink);stroke-width:1.6;fill:none;stroke-linecap:round;stroke-linejoin:round}
.ease-ed{display:flex;flex-direction:column;gap:8px;padding:10px;border-radius:14px;background:var(--field)}
.ease-svg{width:100%;height:auto;max-height:190px;overflow:visible;touch-action:none;user-select:none}
.ez-box{fill:var(--panel);stroke:var(--line-strong);stroke-width:1;stroke-dasharray:3 3}
.ez-curve{fill:none;stroke:var(--ink);stroke-width:2.2;stroke-linecap:round}

.ez-nums{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
.ez-nums input{width:100%;height:28px;border:0;border-radius:999px;background:var(--panel);text-align:center;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;outline:none}

.ez-code{flex:1;min-width:0;font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.split-view{flex-wrap:wrap}

.astyle .insp-row .btn{align-self:auto}
.astyle-meta{display:flex;gap:8px;align-items:center;margin:0;font-size:11.5px;color:var(--muted)}
.astyle-mod{padding:2px 8px;border-radius:999px;background:color-mix(in srgb,var(--warn) 22%,transparent);color:var(--ink);font-weight:600}

.astyle-q{display:flex;flex-direction:column;gap:6px;padding:8px;border-radius:10px;background:var(--panel)}
.astyle-q p{margin:0;font-size:12px;line-height:1.4}
.grow-fld{flex:1;padding:0 12px}
.anim-tp .rng output{min-width:52px}
.row.is-previewing{pointer-events:none}
html.insp-anim .row.is-editing .slot[data-anim]::after{content:attr(data-anim);position:absolute;top:10px;right:10px;z-index:4;max-width:calc(100% - 20px);padding:5px 10px;border-radius:999px;background:var(--chip);color:var(--on-chip);font:600 11px/1.2 var(--font);letter-spacing:0;text-transform:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-shadow:var(--shadow-soft);pointer-events:none;animation:fadeIn 200ms ease both}
.insp-views{display:grid;grid-template-columns:1fr 1fr;gap:2px;margin:8px 12px 0;padding:3px;border-radius:999px;background:var(--field)}
.insp-views button{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:28px;border-radius:999px;font-size:12px;font-weight:600;color:var(--muted);transition:background-color 160ms ease,color 160ms ease}
.insp-views button:hover{color:var(--ink)}
.insp-views button[aria-selected="true"]{background:var(--seg-on);color:var(--ink);box-shadow:var(--shadow-soft)}
.insp-views svg.i{width:14px;height:14px}
.alist{display:flex;flex-direction:column;gap:2px;padding:3px;border-radius:14px;background:var(--field)}
.alist button{display:flex;align-items:center;gap:8px;min-height:32px;padding:4px 12px;border-radius:11px;text-align:left;color:var(--muted);transition:background-color 160ms ease,color 160ms ease}
.alist button:hover{color:var(--ink)}
.alist button[aria-pressed="true"]{background:var(--seg-on);color:var(--ink);box-shadow:var(--shadow-soft)}

/* Text */
.slot-text{display:flex;flex-direction:column;color:var(--ink)}

.tpad{flex:1;display:flex;flex-direction:column;min-height:0}

.tblocks{display:flex;flex-direction:column;flex:1}

.align-end .tblocks{justify-content:flex-end}
.align-spread .tblocks{justify-content:space-between}
.tb{margin:0;white-space:pre-wrap;overflow-wrap:break-word;text-wrap:pretty;font-optical-sizing:auto;font-size:max(calc(var(--fs) * var(--k)), min(calc(var(--fs) * 1px), 12px))}

.tb.is-copy{max-width:64ch}
.tb.is-copy[data-align="center"]{margin-inline:auto}
.tb.is-copy[data-align="right"]{margin-left:auto}

/* Media */
.media{background:var(--surface);margin:0}
.media img,.media video{display:block;width:100%;height:auto}
.media.is-fixed img,.media.is-fixed video,.row.has-h .media img,.row.has-h .media video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.row.has-h .media{aspect-ratio:auto!important}
.row[data-layout="half"] .media:not(.is-fixed){height:100%}
.row[data-layout="half"] .media img,.row[data-layout="half"] .media video{height:100%;object-fit:cover}
.media img,.media video,.car-slide img,.fs-media img,.fs-media video{opacity:0;transition:opacity 520ms ease}

.media-ctrls{position:absolute;right:14px;bottom:14px;z-index:2;display:flex;gap:6px;opacity:0;transform:translateY(4px);transition:opacity 180ms ease,transform 240ms var(--ease-out)}
.slot-video:hover .media-ctrls,.fs-media[data-kind="video"]:hover .media-ctrls,.media-ctrls:focus-within{opacity:1;transform:none}
@media (hover:none){.media-ctrls{opacity:1;transform:none}}
.mc{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--material);color:var(--ink);-webkit-backdrop-filter:blur(16px) saturate(180%);backdrop-filter:blur(16px) saturate(180%);box-shadow:inset 0 0 0 .5px var(--material-edge);transition:transform 140ms var(--ease-out)}
.mc:active{transform:scale(.92)}
.mc svg.i{width:16px;height:16px}

/* Full screen */
.fs{position:relative;display:flex;min-height:100svh;overflow:clip}
.row.has-h .fs{min-height:calc(var(--h) * var(--u))}
.fs-media{position:absolute;inset:0;border-radius:0;background:var(--surface)}
.fs-media[data-kind="color"]{background:var(--fs-color)}
.fs-media img,.fs-media video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.fs-dim{position:absolute;inset:0;background:#000;pointer-events:none;transition:opacity 200ms ease}
.fs-scrim{position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(0,0,0,.46) 0%,rgba(0,0,0,.24) 20%,rgba(0,0,0,0) 38%)}
.fs-overlay{position:relative;z-index:1;flex:1;display:flex;padding:clamp(20px,5vh,56px) var(--col-r) clamp(20px,5vh,56px) var(--col-l);pointer-events:none}
.fs-overlay > *{pointer-events:auto}
.fs-overlay[data-w="screen"]{padding-left:20px}
.fs-overlay[data-pos^="t"]{align-items:flex-start}
.fs-overlay[data-pos^="m"]{align-items:center}
.fs-overlay[data-pos^="b"]{align-items:flex-end}
.fs-overlay[data-pos$="l"]{justify-content:flex-start}
.fs-overlay[data-pos$="c"]{justify-content:center}
.fs-overlay[data-pos$="r"]{justify-content:flex-end}
.fs-overlay > .slot{width:100%}
.fs-overlay[data-w="half"] > .slot{width:calc(50% - 10px)}
.fs-media.dropzone,.fs-media.slot-picker{position:absolute;inset:0;aspect-ratio:auto}

/* Carousel + step player */
.slot-carousel{background:var(--surface)}
.carousel{position:relative;width:100%;aspect-ratio:var(--ar,16/10);overflow:clip;border-radius:inherit;background:var(--surface);user-select:none;-webkit-user-select:none;outline:none}
.row.has-h .carousel{aspect-ratio:auto;height:calc(var(--h) * var(--u))}
.row[data-layout="half"] .slot-carousel:not(.is-edit) .carousel{height:100%}
.carousel:focus-visible{box-shadow:inset 0 0 0 2px var(--focus)}
.car-viewport{position:absolute;inset:0;overflow:hidden;touch-action:pan-y;cursor:grab}
.carousel.is-dragging .car-viewport{cursor:grabbing}
.car-track{display:flex;height:100%;will-change:transform}
.car-slide{position:relative;flex:0 0 100%;height:100%}
.car-slide img{display:block;width:100%;height:100%;object-fit:cover;pointer-events:none;-webkit-user-drag:none}
.car-arrow{position:absolute;top:50%;z-index:2;width:42px;height:42px;margin-top:-21px;border-radius:50%;display:grid;place-items:center;background:rgba(28,28,30,.66);color:#FFFFFF;-webkit-backdrop-filter:blur(16px) saturate(160%);backdrop-filter:blur(16px) saturate(160%);opacity:0;transform:scale(.94);transition:opacity 180ms ease,transform 220ms var(--ease-out)}
.car-arrow.prev{left:16px}.car-arrow.next{right:16px}

@media (hover:hover) and (pointer:fine){.carousel:hover .car-arrow:not(:disabled){opacity:1;transform:none}}
.carousel:focus-visible .car-arrow:not(:disabled){opacity:1;transform:none}
.car-arrow:disabled{pointer-events:none}

.spl{position:absolute;left:50%;bottom:16px;z-index:3;transform:translateX(-50%);display:flex;align-items:center;gap:6px;color:#FFFFFF}
.spl-slab{display:flex;padding:14px;border-radius:18px;background:rgba(30,30,32,.74);-webkit-backdrop-filter:blur(16px) saturate(160%);backdrop-filter:blur(16px) saturate(160%)}

.spl-dot::before{content:"";position:absolute;inset:-12px -4px}
.spl-dot:focus-visible{outline-offset:4px}
.spl-ink{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:999px;background:#FFFFFF;pointer-events:none}
.spl-tool{width:36px;height:36px;flex:none;border-radius:18px;background:rgba(30,30,32,.74);-webkit-backdrop-filter:blur(16px) saturate(160%);backdrop-filter:blur(16px) saturate(160%);transition:transform 130ms cubic-bezier(.3,.9,.4,1)}

.spl-go{width:100%;height:100%;display:grid;place-items:center;border-radius:18px}
.spl-go svg{width:14px;height:14px;overflow:visible}

/* Row tools */
.row-tools{position:absolute;top:12px;right:12px;z-index:6;display:flex;align-items:center;gap:2px;padding:4px;border-radius:999px;background:var(--material);color:var(--ink);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);box-shadow:inset 0 0 0 .5px var(--material-edge),var(--shadow-float);opacity:0;transform:translateY(-4px) scale(.98);transform-origin:top right;transition:opacity 160ms ease,transform 220ms var(--ease-out);pointer-events:none}

.rt-q{padding:0 8px 0 10px;font-size:13px;font-weight:600;white-space:nowrap}
.icon-btn{width:32px;height:32px;flex:none;border-radius:50%;display:grid;place-items:center;transition:background-color 160ms ease,transform 140ms var(--ease-out),opacity 160ms ease}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:36px;padding:0 16px;border-radius:999px;font-size:13px;font-weight:600;letter-spacing:-.005em;white-space:nowrap;cursor:pointer;transition:transform 140ms var(--ease-out),background-color 160ms ease,opacity 200ms ease,color 160ms ease}

.btn.danger{background:var(--danger);color:#FFFFFF}
.btn.grow{flex:1}
.btn svg.i{width:15px;height:15px}

/* Edit mode inside modules */
.row.is-editing .row-grid > .slot,.row.is-editing .fs-overlay > .slot{outline:1.5px dashed var(--line-strong);outline-offset:4px}
.row.is-editing .fs-media{outline:2px dashed color-mix(in srgb,var(--ink) 30%,transparent);outline-offset:-8px}

.tb[contenteditable]{outline:none;border-radius:6px;cursor:text;transition:background-color 160ms ease,box-shadow 160ms ease;min-height:1em}
.tb[contenteditable]:hover{background:color-mix(in srgb,currentColor 5%,transparent)}

.tb[contenteditable]:empty::before{content:attr(data-placeholder);opacity:.32;pointer-events:none}
.tb.is-new{animation:blockIn 220ms var(--ease-out) both}
.ed-add-block{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;margin-top:16px;padding:7px 14px 7px 10px;border-radius:999px;font-family:var(--font);font-size:13px;font-weight:600;letter-spacing:0;text-transform:none;opacity:.55;transition:opacity 160ms ease,background-color 160ms ease,transform 140ms var(--ease-out)}
.ed-add-block:hover{opacity:1;background:color-mix(in srgb,currentColor 7%,transparent)}
.ed-add-block:active{transform:scale(.97)}
.ed-add-block svg.i{width:15px;height:15px;stroke-width:2}

.dropzone{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:28px;background:var(--surface);color:var(--muted);aspect-ratio:var(--dz-ar,16/9);cursor:pointer;transition:background-color 200ms ease,color 200ms ease,box-shadow 200ms ease}

.dz-title{font-size:14.5px;font-weight:600;color:var(--ink);letter-spacing:-.01em}

.spinner{width:22px;height:22px;border-radius:50%;border:2px solid var(--line-strong);border-top-color:var(--ink);animation:spin 600ms linear infinite}
.uploading-veil{position:absolute;inset:0;z-index:3;display:grid;place-items:center;background:color-mix(in srgb,var(--bg) 55%,transparent);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}

.slot-picker{display:flex;flex-direction:column;justify-content:center;gap:16px;padding:clamp(20px,3cqi,32px);background:var(--surface);min-height:240px}

.fs-media.slot-picker .picker-grid{width:min(560px,100%)}
.picker-label{margin:0;font-size:13px;font-weight:600;color:var(--muted)}
.picker-grid{display:grid;grid-template-columns:repeat(var(--n,4),minmax(0,1fr));gap:10px}
@container (max-width:560px){.picker-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.pick{display:flex;flex-direction:column;align-items:flex-start;gap:14px;padding:16px;border-radius:14px;background:var(--bg);text-align:left;box-shadow:var(--shadow-soft);transition:transform 160ms var(--ease-out),box-shadow 200ms ease;animation:pickIn 360ms var(--ease-out) both;animation-delay:calc(var(--i,0) * 35ms)}
.pick:hover{box-shadow:inset 0 0 0 1.5px var(--ink),var(--shadow-soft)}
.pick:active{transform:scale(.97)}
.pick-ico{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:var(--surface)}
.pick strong{display:block;font-size:14px;font-weight:650;letter-spacing:-.01em}
.pick small{display:block;margin-top:2px;font-size:12px;color:var(--muted);line-height:1.35}

.thumbs{display:flex;gap:8px;padding:12px;overflow-x:auto;scrollbar-width:thin}
.thumb{position:relative;flex:none;width:76px;height:76px;border-radius:12px;overflow:clip;background:var(--surface-2);cursor:grab;touch-action:none;transition:transform 220ms var(--ease-out),box-shadow 200ms ease;outline:none}
.thumb img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.thumb:focus-visible{box-shadow:0 0 0 2px var(--focus)}

.thumb-n{position:absolute;left:6px;bottom:6px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;display:grid;place-items:center;background:var(--chip);color:var(--on-chip);font-size:10.5px;font-weight:700;font-variant-numeric:tabular-nums}

.thumb:hover .thumb-x,.thumb:focus-within .thumb-x{opacity:1;transform:none}
@media (hover:none){.thumb-x{opacity:1;transform:none}}
.thumb-add{display:grid;place-items:center;background:transparent;box-shadow:inset 0 0 0 1.5px var(--line-strong);color:var(--muted);cursor:pointer;transition:color 160ms ease,box-shadow 160ms ease,transform 140ms var(--ease-out)}
.thumb-add:hover{color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.thumb.is-pending{display:grid;place-items:center;cursor:progress}
.thumb-hint{padding:0 14px 12px;margin:0;font-size:12px;color:var(--muted)}
.slot-carousel.is-edit .carousel{border-radius:var(--radius) var(--radius) 0 0}

.rz{position:absolute;left:50%;bottom:-18px;z-index:7;width:96px;height:28px;margin-left:-48px;display:grid;place-items:center;cursor:ns-resize;touch-action:none}
.rz i{width:44px;height:5px;border-radius:3px;background:var(--ink);opacity:.3;box-shadow:0 0 0 3px var(--bg);transition:opacity 160ms ease,transform 220ms var(--ease-out)}

.rz-val{position:absolute;bottom:30px;padding:4px 8px;border-radius:8px;background:var(--chip);color:var(--on-chip);font-size:11.5px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;opacity:0;transform:translateY(4px);transition:opacity 140ms ease,transform 200ms var(--ease-out);pointer-events:none}
.row.is-resizing .rz-val{opacity:1;transform:none}

/* Adder */
.adder{position:relative;border-radius:var(--radius);background:var(--surface);color:var(--muted);overflow:clip}
.adder-btn{width:100%;min-height:96px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:20px;font-size:14px;font-weight:600;letter-spacing:-.01em;text-align:center;transition:color 180ms ease;animation:fadeBlurIn 280ms var(--ease-out) both}

.adder-plus{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--bg);color:var(--ink);box-shadow:var(--shadow-soft);transition:transform 260ms var(--ease-out)}

@media (hover:hover) and (pointer:fine){.adder-btn:hover{color:var(--ink)}.adder-btn:hover .adder-plus{transform:scale(1.08)}}

.ac-options{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.ac-opt{display:flex;flex-direction:column;gap:14px;padding:14px;border-radius:16px;background:var(--bg);text-align:left;color:var(--ink);box-shadow:var(--shadow-soft);transition:transform 160ms var(--ease-out),box-shadow 200ms ease}
.ac-opt:hover{box-shadow:inset 0 0 0 1.5px var(--ink),var(--shadow-soft)}
.ac-opt:active{transform:scale(.98)}
.ac-opt{padding:0;gap:0;overflow:clip}
.ac-art{display:block;width:100%;aspect-ratio:160/68}
.ac-art svg{display:block;width:100%;height:100%}
.ac-art .a-fill{fill:var(--surface-2);transition:fill 220ms ease}
.ac-art .a-rail rect{fill:var(--line-strong);transition:fill 220ms ease}
.ac-art .a-text{fill:var(--bg);opacity:.85}
.ac-opt[data-layout="fullscreen"] .a-rail rect{fill:var(--bg);opacity:.85}
@media (hover:hover) and (pointer:fine){.ac-opt:hover .a-fill{fill:var(--ink)}.ac-opt:hover .a-rail rect{fill:var(--ink)}.ac-opt[data-layout="fullscreen"]:hover .a-rail rect{fill:var(--bg)}}
.ac-label{padding:12px 16px 16px}
.ac-label strong{display:block;font-size:14px;font-weight:650;letter-spacing:-.01em}
.ac-label small{display:block;margin-top:2px;font-size:12px;color:var(--muted)}

/* ---------- Inspector ---------- */
.insp{position:fixed;z-index:55;left:20px;top:calc(84px + env(safe-area-inset-top,0px));width:clamp(272px,calc(25vw - 40px),360px);max-height:calc(100dvh - 104px - env(safe-area-inset-top,0px));display:flex;flex-direction:column;border-radius:18px;background:var(--panel);color:var(--ink);box-shadow:var(--shadow-panel);font-size:12.5px;overflow:hidden;animation:inspIn 320ms var(--ease-out) both}
.insp-head{display:flex;align-items:center;gap:8px;padding:12px 12px 4px}
.insp-back{width:34px;height:34px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--field);color:var(--ink);transition:background-color 160ms ease,transform 140ms var(--ease-out),opacity 160ms ease}
.insp-back:hover{background:var(--field-hover)}
.insp-back:active{transform:scale(.92)}
.insp-back:disabled{opacity:.3;pointer-events:none}
.insp-back svg.i{width:17px;height:17px;stroke-width:2}
.types{position:fixed;z-index:56;left:20px;top:calc(20px + env(safe-area-inset-top,0px));display:flex;gap:4px;padding:5px;border-radius:999px;background:var(--panel);box-shadow:var(--shadow-panel);opacity:0;transform:translateY(-6px) scale(.98);transform-origin:left center;pointer-events:none;transition:opacity 220ms ease,transform 300ms var(--ease-out)}
.types.is-on{opacity:1;transform:none;pointer-events:auto}
.types button{position:relative;z-index:1;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--muted);transition:color 220ms ease,transform 140ms var(--ease-out)}
.types button:hover{color:var(--ink)}
.types button:active{transform:scale(.92)}
.types button[aria-pressed="true"]{color:var(--bg)}
.types svg.i{width:19px;height:19px}
.types-ind{position:absolute;left:5px;top:5px;width:40px;height:40px;border-radius:50%;background:var(--ink);box-shadow:0 0 0 2px var(--panel),0 0 0 3.5px color-mix(in srgb,var(--ink) 28%,transparent);transition:transform 320ms var(--ease-out),opacity 200ms ease}
.insp-title{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:650;letter-spacing:-.01em}
.insp-title .dot{width:7px;height:7px;border-radius:50%;background:var(--warn)}
.insp-sub{margin-left:auto;font-size:11.5px;font-weight:500;color:var(--muted)}
.insp-tabs{flex:1;min-width:0;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:2px;padding:3px;border-radius:999px;background:var(--field)}
.insp-tabs button{height:28px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:background-color 160ms ease,color 160ms ease}
.insp-tabs button[aria-selected="true"]{background:var(--seg-on);color:var(--ink);box-shadow:var(--shadow-soft)}
.insp-body{overflow-y:auto;display:flex;flex-direction:column;gap:18px;padding:10px 14px 16px;scrollbar-width:thin}
.insp-sec{display:flex;flex-direction:column;gap:8px}
.insp-sec h4{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:0 0 2px;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.insp-sec h4 span{font-weight:500;letter-spacing:0;text-transform:none}
.insp-hint{margin:0;font-size:12px;line-height:1.45;color:var(--muted)}
.insp-row{display:flex;align-items:center;gap:6px}
.insp-line{display:grid;grid-template-columns:78px minmax(0,1fr);align-items:center;gap:8px}
.insp-line.top{align-items:start}
.insp-line .lbl{font-size:12px;font-weight:500;color:var(--muted)}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.fld{display:flex;align-items:center;height:34px;min-width:0;border-radius:999px;background:var(--field);transition:box-shadow 160ms ease,background-color 160ms ease}
.fld:hover{background:var(--field-hover)}
.fld:focus-within{box-shadow:inset 0 0 0 1.5px var(--focus);background:var(--field)}
.fld-k{width:34px;padding-left:4px;height:100%;flex:none;display:grid;place-items:center;color:var(--muted);cursor:ew-resize;touch-action:none;user-select:none}
.fld-k svg.i{width:15px;height:15px}
.fld input{flex:1;min-width:0;width:100%;height:100%;border:0;padding:0;background:transparent;outline:none;font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums}
.fld input::placeholder{color:var(--muted);font-weight:500}
.fld-u{flex:none;padding-right:12px;font-size:11.5px;color:var(--muted)}
.fld-dd{flex:none;width:26px;height:100%;display:grid;place-items:center;color:var(--muted);border-left:1px solid var(--line);border-radius:0 999px 999px 0;width:30px}
.fld-dd:hover{color:var(--ink)}
.fld-dd svg.i{width:13px;height:13px;stroke-width:2.2}
.fld.is-off{opacity:.5}
.segc{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:2px;height:34px;padding:3px;border-radius:999px;background:var(--field)}
.segc button{min-width:0;border-radius:999px;display:grid;place-items:center;font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:background-color 160ms ease,color 160ms ease}
.segc button:hover{color:var(--ink)}
.segc button[aria-pressed="true"]{background:var(--seg-on);color:var(--ink);box-shadow:var(--shadow-soft)}
.segc svg.i{width:16px;height:16px}
.swatches{display:flex;gap:4px}
.swatch{position:relative;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--field);cursor:pointer;transition:background-color 160ms ease,transform 140ms var(--ease-out)}
.swatch:hover{background:var(--field-hover)}
.swatch:active{transform:scale(.92)}
.swatch i{width:16px;height:16px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--line-strong)}
.swatch[aria-pressed="true"] i{box-shadow:0 0 0 2px var(--panel),0 0 0 3.5px var(--ink)}
.sw-none i{background:linear-gradient(135deg,transparent calc(50% - .75px),var(--line-strong) calc(50% - .75px),var(--line-strong) calc(50% + .75px),transparent calc(50% + .75px))}
.sw-surface i{background:var(--surface-2)}
.sw-color i{background:conic-gradient(from 0deg,#ff5f57,#ffbd2e,#28c840,#1ec8e5,#002FA7,#bf5af2,#ff5f57)}
.sw-color.is-set i{background:var(--c)}
.swatch input[type="color"]{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.matrix{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;width:96px;padding:5px;border-radius:14px;background:var(--field)}
.matrix button{height:24px;border-radius:999px;display:grid;place-items:center}
.matrix button i{width:5px;height:5px;border-radius:50%;background:var(--muted);transition:transform 200ms var(--ease-out),background-color 160ms ease}
.matrix button:hover i{background:var(--ink)}
.matrix button[aria-pressed="true"]{background:var(--seg-on);box-shadow:var(--shadow-soft)}
.matrix button[aria-pressed="true"] i{width:14px;height:4px;border-radius:2px;background:var(--ink)}
.rng{display:flex;align-items:center;gap:10px}
.rng input{flex:1;accent-color:var(--ink)}
.rng output{min-width:36px;text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.sel{position:relative;display:flex;align-items:center}
.sel select{appearance:none;-webkit-appearance:none;width:100%;height:34px;padding:0 30px 0 14px;border:0;border-radius:999px;background:var(--field);font-size:12.5px;font-weight:600;color:var(--ink);cursor:pointer}
.sel select:hover{background:var(--field-hover)}
.sel select:disabled{opacity:.5;cursor:not-allowed}
.sel svg.i{position:absolute;right:12px;width:13px;height:13px;stroke-width:2.2;pointer-events:none;opacity:.6}
.file-row{display:flex;align-items:center;gap:10px;padding:5px 14px 5px 5px;border-radius:999px;background:var(--field)}
.file-thumb{width:40px;height:40px;flex:none;border-radius:50%;overflow:clip;display:grid;place-items:center;background:var(--surface-2);color:var(--muted)}
.file-thumb img{width:100%;height:100%;object-fit:cover}
.file-meta{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.hex{display:flex;gap:6px}
.insp-foot{display:flex;flex-direction:column;gap:8px;padding:12px 14px 14px;border-top:1px solid var(--line)}
.foot-row{display:flex;gap:8px}
.foot-hint{margin:0;font-size:11.5px;color:var(--muted)}
.foot-hint kbd{font-family:inherit;font-weight:600}

/* ---------- Overlays (menu, search) ---------- */
/* Closed overlays are display:none, not visibility:hidden. Chrome can keep a stale inherited visibility:hidden on
   descendants that have animations running when the overlay opens, which left the menu without its background and
   controls while the category names (re-rendered on open) showed over the page. */
.ov{position:fixed;inset:0;z-index:80;--ov-solid:var(--brand);display:none}
.ov.is-open{display:block}
.ov-bg{position:absolute;inset:0;background:var(--brand)}
/* The circular reveal is a plain circle that grows from the menu button (transform only). It is hidden unless an
   animation shows it, so a stalled frame can never leave the menu without its background. */
.ov-reveal{position:absolute;left:0;top:0;width:0;height:0;border-radius:50%;background:var(--ov-solid);opacity:0;pointer-events:none}
.ov-bg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ov-bg .fs-dim{z-index:1}
.ov-inner{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;overflow-y:auto;padding:20px;padding-top:calc(20px + env(safe-area-inset-top,0px));padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
.ov-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;min-height:48px}
.ov-tl,.ov-tr{display:flex;align-items:flex-start;gap:16px;min-width:0}
.ov-tr{gap:10px;flex:none}
.ov-tl > :empty{display:none}
.ov-close{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;transition:transform 140ms var(--ease-out),background-color 240ms ease,color 240ms ease}
.ov-close:active{transform:scale(.94)}
.ov-close[data-ink="light"]{background:#FFFFFF;color:#000000}
.ov-close[data-ink="dark"]{background:#000000;color:#FFFFFF}
.ov-close svg.i{width:20px;height:20px;stroke-width:1.9}
.ov-list{flex:1;display:flex;flex-direction:column;align-items:flex-start;padding-top:clamp(24px,6vh,64px)}
.ov-list > :first-child{margin-top:auto}
.ov-list > :last-child{max-width:calc(100% - var(--ob-w,0px) - 24px)}
.ov-item{display:flex;align-items:center;gap:10px;max-width:100%}
.ov-cat{font-family:var(--display);font-weight:900;text-transform:uppercase;text-align:left;font-size:clamp(40px,min(8.4vw,calc((100dvh - 300px) / var(--n,4) / .98)),176px);line-height:.98;letter-spacing:-.02em;overflow-wrap:anywhere;transition:opacity 240ms ease}
@media (hover:hover) and (pointer:fine){.ov-list:hover .ov-cat:not(:hover){opacity:.38}}
.ov-item .more{width:40px;height:40px;border-radius:12px}
.ov-item .more svg.i{width:22px;height:22px}
.ov-input{font-family:var(--display);font-weight:900;text-transform:uppercase;font-size:clamp(40px,min(8.4vw,calc((100dvh - 300px) / var(--n,4) / .98)),176px);line-height:.98;letter-spacing:-.02em;padding:0;border-radius:0;width:min(100%,1100px)}
.ov-add{display:inline-flex;align-items:center;gap:10px;margin-top:18px;font-size:16px;font-weight:600;opacity:.6;transition:opacity 160ms ease}
.ov-add:hover{opacity:1}
.ov-bottom{position:absolute;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:10px}
.ov-bottom:empty{display:none}
/* Icon-only switches: theme (top right, subtle ring) and view mode (bottom right, solid like the account chip) */
.seg{--s:40px;position:relative;display:inline-grid;grid-auto-flow:column;grid-auto-columns:var(--s);padding:4px;border-radius:999px;flex:none;transition:background-color 240ms ease,color 240ms ease}
.seg-ind{position:absolute;top:4px;left:4px;width:var(--s);height:var(--s);border-radius:50%;transition:transform 340ms var(--ease-out),background-color 240ms ease}
.seg[data-v="1"] .seg-ind{transform:translateX(var(--s))}
.seg button{position:relative;z-index:1;width:var(--s);height:var(--s);border-radius:50%;display:grid;place-items:center;transition:color 240ms ease,opacity 200ms ease,transform 140ms var(--ease-out)}
.seg button:active{transform:scale(.92)}
.seg svg.i{width:18px;height:18px}
.seg-ghost{box-shadow:inset 0 0 0 1px color-mix(in srgb,currentColor 24%,transparent)}
.seg-ghost .seg-ind{background:color-mix(in srgb,currentColor 18%,transparent)}
.seg-ghost button{opacity:.55}
.seg-ghost button[aria-pressed="true"],.seg-ghost button:hover{opacity:1}
.seg-solid{--s:42px}
.seg-solid[data-ink="light"]{background:#FFFFFF;color:#000000}
.seg-solid[data-ink="dark"]{background:#000000;color:#FFFFFF}
.seg-solid .seg-ind{background:var(--ov-solid)}
.seg-solid[data-ink="light"] button[aria-pressed="true"]{color:#FFFFFF}
.seg-solid[data-ink="dark"] button[aria-pressed="true"]{color:#000000}
.acct{display:inline-flex;align-items:center;gap:10px;height:50px;padding:0 6px;border-radius:999px;transition:background-color 240ms ease,color 240ms ease}
.acct[data-ink="light"]{background:#FFFFFF;color:#000000}
.acct[data-ink="dark"]{background:#000000;color:#FFFFFF}
.acct-in{padding:0 22px 0 18px;font-size:15px;font-weight:500;letter-spacing:-.01em;transition:background-color 240ms ease,color 240ms ease,transform 140ms var(--ease-out)}
.acct-in:active{transform:scale(.97)}
.acct-in svg.i{width:17px;height:17px}
.acct .av{width:38px;height:38px;flex:none;border-radius:50%;display:grid;place-items:center;overflow:hidden;background:var(--ov-solid);font-size:13px;font-weight:700;letter-spacing:.02em}
.acct[data-ink="light"] .av{color:#FFFFFF}
.acct[data-ink="dark"] .av{color:#000000}
.acct .av img{width:100%;height:100%;object-fit:cover}
.acct-txt{display:flex;flex-direction:column;min-width:0;line-height:1.2}
.acct-txt b{font-size:14px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:22ch}
.acct-txt small{font-size:12px;opacity:.55;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:26ch}
.acct-out{height:38px;padding:0 16px;margin-left:4px;border-radius:999px;font-size:14px;font-weight:500;box-shadow:inset 0 0 0 1px color-mix(in srgb,currentColor 18%,transparent);transition:box-shadow 160ms ease,transform 140ms var(--ease-out)}
.acct-out:hover{box-shadow:inset 0 0 0 1px color-mix(in srgb,currentColor 50%,transparent)}
.acct-out:active{transform:scale(.96)}
.ovbg{display:flex;flex-direction:column;align-items:flex-start;gap:10px;font-size:13px;font-weight:600}
.ovbg .lbl{opacity:.75}
.ovbg-row{display:flex;align-items:center;gap:8px}
.ovsw{position:relative;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;cursor:pointer;box-shadow:inset 0 0 0 1.5px color-mix(in srgb,currentColor 35%,transparent);transition:transform 140ms var(--ease-out),box-shadow 160ms ease}
.ovsw:active{transform:scale(.92)}
.ovsw[aria-pressed="true"]{box-shadow:0 0 0 2px currentColor}
.ovsw i{width:22px;height:22px;border-radius:50%;box-shadow:inset 0 0 0 1.5px color-mix(in srgb,currentColor 45%,transparent)}
.ovsw svg.i{width:16px;height:16px}
.ovsw input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.ovbg input[type="range"]{width:90px;accent-color:currentColor}

.ov-search .ov-bg{background:var(--bg)}
.ov-search .ov-inner{color:var(--ink)}
.ov-search .ov-close{background:var(--ink);color:var(--bg)}
.srch{width:min(1120px,100%);margin:clamp(20px,7vh,88px) auto 0;display:flex;flex-direction:column;gap:20px}
.srch-field{position:relative;display:flex;align-items:center;gap:16px;padding-bottom:14px;border-bottom:2px solid var(--line)}
.srch-field:focus-within{border-bottom-color:var(--ink)}
.srch-field svg.i{width:clamp(26px,3vw,40px);height:clamp(26px,3vw,40px);stroke-width:2.2;flex:none;opacity:.35}
.srch-input{flex:1;min-width:0;border:0;outline:none;background:transparent;font-family:var(--display);font-weight:900;text-transform:uppercase;font-size:clamp(40px,6.2vw,104px);line-height:1;letter-spacing:-.02em;color:var(--ink);caret-color:var(--focus)}
.srch-input::placeholder{color:var(--ink);opacity:.14}
.srch-input::-webkit-search-cancel-button{display:none}
.srch-results{display:flex;flex-direction:column;gap:2px;padding-bottom:40px}
.sr{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:4px 16px;padding:14px 16px;border-radius:14px;text-align:left;transition:background-color 140ms ease}
.sr:hover,.sr[aria-selected="true"]{background:var(--surface)}
.sr-title{font-size:18px;font-weight:600;letter-spacing:-.015em}
.sr-crumb{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);grid-row:span 2;align-self:center}
.sr-snip{font-size:14px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sr mark{background:transparent;color:var(--ink);font-weight:700;box-shadow:inset 0 -.38em color-mix(in srgb,var(--focus) 26%,transparent)}
.sr-empty{margin:8px 16px;color:var(--muted);font-size:15px}
.sr-hint{margin:4px 16px 8px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.qi{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:28px 24px;padding:8px 16px 40px}
.qi h3{margin:0 0 10px;font-family:var(--display);font-weight:900;text-transform:uppercase;font-size:24px;line-height:.95;letter-spacing:-.01em}
.qi ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.qi button{font-size:15px;font-weight:500;padding:3px 0;opacity:.5;transition:opacity 160ms ease;text-align:left}
.qi button:hover{opacity:1}
.qi p{margin:0;font-size:14px;color:var(--muted)}

/* ---------- Popover, status, toasts ---------- */
.pop{position:fixed;z-index:120;min-width:200px;max-width:280px;max-height:60vh;overflow-y:auto;padding:6px;border-radius:14px;background:var(--material);color:var(--ink);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);box-shadow:inset 0 0 0 .5px var(--material-edge),var(--shadow-float);transform-origin:var(--origin,top right);animation:popIn 170ms var(--ease-out) both;font-size:13.5px;text-shadow:none}
.pop.is-closing{animation:popOut 120ms ease-out both}
.mi{width:100%;display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:999px;font-size:13.5px;font-weight:500;text-align:left;transition:background-color 120ms ease}
.mi:hover,.mi:focus-visible{background:var(--surface-2);outline:none}
.mi.danger{color:var(--danger)}
.mi svg.i{width:16px;height:16px}
.mi .mi-v{margin-left:auto;color:var(--muted);font-variant-numeric:tabular-nums}
.mi[aria-checked="true"]{font-weight:700}
.pop-q{margin:4px 8px 10px;font-size:13px;line-height:1.4}
.pop-q strong{font-weight:650}
.pop-actions{display:flex;gap:6px;justify-content:flex-end;padding:0 2px 2px}
.status{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:40;display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 12px;border-radius:999px;background:var(--material);color:var(--muted);-webkit-backdrop-filter:blur(16px) saturate(180%);backdrop-filter:blur(16px) saturate(180%);box-shadow:inset 0 0 0 .5px var(--material-edge),var(--shadow-soft);font-size:12px;font-weight:500;white-space:nowrap}
.status:empty{display:none}
.status i{width:6px;height:6px;border-radius:50%;background:var(--ok)}
.status[data-state="saving"] i{background:var(--warn);animation:pulse 1s ease-in-out infinite}
.status[data-state="error"] i{background:var(--danger)}
.status[data-state="local"] i{background:var(--line-strong)}
.toasts{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:130;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;width:max-content;max-width:calc(100vw - 32px)}
.toast{padding:11px 16px;border-radius:12px;background:var(--chip);color:var(--on-chip);font-size:13px;font-weight:500;box-shadow:var(--shadow-float);animation:toastIn 300ms var(--ease-out) both}
.toast.is-leaving{animation:toastOut 200ms ease-in both}

/* ---------- Motion ---------- */
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeBlurIn{from{opacity:0;filter:blur(4px);transform:scale(.99)}to{opacity:1;filter:none;transform:none}}
@keyframes rowIn{from{opacity:0;transform:translateY(16px) scale(.985);filter:blur(4px)}to{opacity:1;transform:none;filter:none}}
@keyframes pageIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes slotIn{from{opacity:0;transform:scale(.985)}to{opacity:1;transform:none}}
@keyframes blockIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@keyframes navIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
@keyframes pickIn{from{opacity:0;transform:translateY(8px) scale(.97)}to{opacity:1;transform:none}}
@keyframes inspIn{from{opacity:0;transform:translateX(-12px) scale(.98)}to{opacity:1;transform:none}}
@keyframes popIn{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:none}}
@keyframes popOut{to{opacity:0;transform:scale(.97)}}
@keyframes toastIn{from{opacity:0;transform:translateY(12px) scale(.96)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateY(8px) scale(.98)}}
@keyframes flash{0%{opacity:0}12%{opacity:1}70%{opacity:1}100%{opacity:0}}
@keyframes shimmer{0%,100%{opacity:1}50%{opacity:.45}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes spin{to{transform:rotate(360deg)}}
::view-transition-old(root),::view-transition-new(root){animation-duration:280ms;animation-timing-function:ease}

@media (prefers-reduced-motion: reduce){
  @keyframes rowIn{from{opacity:0}to{opacity:1}}
  @keyframes pageIn{from{opacity:0}to{opacity:1}}
  @keyframes fadeBlurIn{from{opacity:0}to{opacity:1}}
  @keyframes slotIn{from{opacity:0}to{opacity:1}}
  @keyframes blockIn{from{opacity:0}to{opacity:1}}
  @keyframes navIn{from{opacity:0}to{opacity:1}}
  @keyframes pickIn{from{opacity:0}to{opacity:1}}
  @keyframes inspIn{from{opacity:0}to{opacity:1}}
  @keyframes popIn{from{opacity:0}to{opacity:1}}
  @keyframes toastIn{from{opacity:0}to{opacity:1}}
  .pill-ind,.thumb{transition-duration:0ms!important}
  .skel,.status i{animation:none!important}
}

@media (max-width:860px){

    const s = S.edit && findSlot(S.edit.draft, th.parentElement.dataset.slot); if (!s) return;
    const i = +th.dataset.index, j = i + (ev.key === 'ArrowLeft' ? -1 : 1);
    if (j < 0 || j >= s.images.length) return;
    record(null);
    [s.images[i], s.images[j]] = [s.images[j], s.images[i]];
    bump();
    const nt = $(`.thumbs[data-slot="${s.id}"] .thumb[data-index="${j}"]`); nt && nt.focus();
  }
});
document.addEventListener('focusout', (ev) => {
  const t = ev.target;
  if (t && t.id === 'inline-input') setTimeout(() => { if (t.isConnected && S.inline && document.activeElement !== t) commitInline(t.value); }, 0);
});

/* Drag and drop of files */
let overEl = null;
const canImport = () => S.backend === 'supabase' && S.canEdit && S.mode === 'admin' && !S.edit && !S.importing;
document.addEventListener('dragover', (ev) => {
  const z = ev.target.closest && ev.target.closest('[data-drop]');
  if (!z && canImport() && ev.dataTransfer && [...ev.dataTransfer.types].includes('Files')) { ev.preventDefault(); ev.dataTransfer.dropEffect = 'copy'; return; }
  if (!z || !S.edit || !ev.dataTransfer || ![...ev.dataTransfer.types].includes('Files')) return;
  ev.preventDefault(); ev.dataTransfer.dropEffect = 'copy';
  if (overEl !== z) { overEl && overEl.classList.remove('is-over'); overEl = z; z.classList.add('is-over'); }
});
document.addEventListener('dragleave', (ev) => { if (overEl && !overEl.contains(ev.relatedTarget)) { overEl.classList.remove('is-over'); overEl = null; } });
document.addEventListener('drop', (ev) => {
  const z = ev.target.closest && ev.target.closest('[data-drop]');
  if (overEl) { overEl.classList.remove('is-over'); overEl = null; }
  if (!z && canImport() && ev.dataTransfer && [...ev.dataTransfer.files].some(f => /\.json$/i.test(f.name))) { ev.preventDefault(); importExport(ev.dataTransfer.files); return; }
  if (!z || !S.edit) return;
  ev.preventDefault();
  handleFiles(z.dataset.drop, ev.dataTransfer.files);
});

/* ---------- One-time import of the artifact content (Supabase) ----------
   An editor drops the export (belo-export.json plus its image files) anywhere on the page. Every file is uploaded to
   the bucket, the old asset ids are swapped for the new ones, and the documents are saved through the normal save path. */
async function importExport(fileList) {
  const files = [...fileList];
  const jf = files.find(f => /\.json$/i.test(f.name));
  let exp = null;
  try { exp = JSON.parse(await jf.text()); } catch {}
  if (!exp || exp.format !== 'belo-catalog-export' || !exp.docs || !exp.docs['catalog/tree']) { toast('Ese archivo no es una exportación del catálogo.'); return; }
  const byName = new Map(files.filter(f => f !== jf).map(f => [f.name, f]));
  const olds = Object.keys(exp.assets || {});
  const missing = olds.filter(id => !byName.has(exp.assets[id].file));
  if (missing.length) { toast(`Faltan ${missing.length} ${missing.length === 1 ? 'archivo' : 'archivos'} de la exportación. Suelta el .json junto con todas sus imágenes.`); return; }
  const paths = Object.keys(exp.docs).filter(p => /^(catalog\/tree|pages\/[A-Za-z0-9_-]{1,64})$/.test(p));
  const count = (n, one, many) => `${n} ${n === 1 ? one : many}`;
  const what = `${count(paths.length - 1, 'sección', 'secciones')} y ${count(olds.length, 'archivo', 'archivos')}`;
  if (!confirm(`Importar ${what} al catálogo compartido. Reemplaza el árbol de categorías actual. ¿Seguir?`)) return;
  S.importing = true;
  const map = new Map();
  try {
    for (let i = 0; i < olds.length; i++) {
      const a = exp.assets[olds[i]];
      S.uploading.set('import', { label: `Importando ${i + 1} de ${olds.length}` }); renderStatus();
      const r = await B.assets.upload(byName.get(a.file), { type: a.type || byName.get(a.file).type });
      map.set(olds[i], r.id);
    }
  } catch (e) {
    S.uploading.delete('import'); S.importing = false; renderStatus();
    dropAssets([...map.values()]);
    toast(UPLOAD_ERR[e && e.code] || 'No se pudo subir un archivo de la exportación. No se importó nada.');
    return;
  }
  S.uploading.delete('import');
  const swap = (v) => typeof v === 'string' ? (map.get(v) || v) : Array.isArray(v) ? v.map(swap) : v && typeof v === 'object' ? Object.fromEntries(Object.entries(v).map(([k, x]) => [k, swap(x)])) : v;
  paths.forEach(p => { const data = swap(exp.docs[p]); commit(p, () => clone(data)); notify(p); });
  S.importing = false;
  S.tree = normTree(viewOf('catalog/tree'));
  S.cat = null;
  onTree();
  toast(`Listo: se importaron ${what}.`);
}
document.addEventListener('pointerdown', (ev) => { if (S.pop && !ev.target.closest('#pop') && !ev.target.closest('[data-action="item-menu"], [data-action="dd"]')) closePop(); }, true);

/* ================= Smooth scroll ================= */
function initLenis() {
  if (RM || typeof window.Lenis !== 'function') return;
  try { lenis = new window.Lenis({ autoRaf: true, lerp: .1, smoothWheel: true, prevent: (n) => !!(n.closest && n.closest('.rail-nav, .ov, .insp, .pop, .thumbs')) }); }
  catch { lenis = null; }
}

boot();
})();
</script>
